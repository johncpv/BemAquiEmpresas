<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDV — 4 opções de layout</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--r:14px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-optical-sizing:auto}
body{background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:15px;transition:background .25s}
/* tokens por segmento */
body.l1{--bg:#EAF0F8;--panel:#fff;--panel2:#F3F6FB;--line:#D6DFEC;--txt:#0B1A33;--mut:#5A6A85;--acc:#0047BB;--hl:#FFD400;--rail:#0047BB;--railtxt:#fff;--warn:#B45309;--dang:#D92D20}
body.l2{--bg:#fff7ef;--panel:#fff;--panel2:#fff1e3;--line:#f1dcc7;--txt:#2b1a0e;--mut:#8a6c55;--acc:#e8590c;--hl:#FFC93C;--rail:#2b1a0e;--railtxt:#f5d9c2;--warn:#B45309;--dang:#D92D20}
body.l3{--bg:#E8EDE6;--panel:#fff;--panel2:#F1F4EF;--line:#D2DBCE;--txt:#18291F;--mut:#5C6E61;--acc:#1E5B3F;--hl:#F2B33D;--rail:#163527;--railtxt:#E3EEE6;--warn:#B7791F;--dang:#C2362B}
body.l4{--bg:#E4E8EE;--panel:#fff;--panel2:#F0F3F7;--line:#CBD3DE;--txt:#141E2B;--mut:#566376;--acc:#1D4ED8;--hl:#FFC400;--rail:#141E2B;--railtxt:#DCE3EC;--warn:#B45309;--dang:#D92D20}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--acc)}
.mono{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.btn{background:var(--panel);border:2px solid var(--line);padding:11px 16px;border-radius:12px;font-weight:700}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dang{background:transparent;border-color:var(--dang);color:var(--dang)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--r)}
.row{display:flex;justify-content:space-between;padding:4px 0}
.r{text-align:right}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--mut);gap:8px;padding:30px;text-align:center}
.empty .e{font-size:46px}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:12px;color:var(--mut);padding:10px 14px;border-bottom:2px solid var(--line);font-weight:700}
td{padding:11px 14px;border-bottom:1px solid var(--line)}

/* topo: assume a cor do segmento */
#top{display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--rail);color:var(--railtxt);flex-shrink:0;transition:background .25s}
#top .logo{font-weight:800;font-size:20px;letter-spacing:-.5px;font-stretch:80%}
#top .logo b{color:var(--hl)}
#tabs{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:12px}
#tabs button{padding:8px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--railtxt);opacity:.75}
#tabs button.on{background:var(--hl);color:#1a1a1a;opacity:1}
#top .info{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:13px;opacity:.85}
#top .dot{width:9px;height:9px;border-radius:50%;background:#3BD16F;display:inline-block;margin-right:6px}
main{flex:1;overflow:hidden}
.view{display:none;height:100%}
.view.on{display:flex}

/* ===== 1 MERCADO ===== */
#v1{gap:14px;padding:14px}
#v1 .left{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
#v1 .right{width:380px;display:flex;flex-direction:column;gap:14px}
#l1last{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-left:10px solid var(--hl)}
#l1last .n{font-size:26px;font-weight:800;letter-spacing:-.5px}
#l1last .v{font-size:22px;font-weight:700;color:var(--acc)}
#l1search{position:relative;padding:14px}
#l1search input{font-size:22px;padding:16px 18px 16px 54px;border-width:3px;border-color:var(--acc);font-weight:600}
#l1search .ico{position:absolute;left:32px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--acc)}
#l1qtd{position:absolute;right:30px;top:50%;transform:translateY(-50%);background:var(--hl);font-weight:800;padding:4px 12px;border-radius:8px;display:none}
#l1sug{position:absolute;left:14px;right:14px;top:calc(100% - 8px);background:#fff;border:2px solid var(--acc);border-radius:12px;z-index:5;overflow:hidden;display:none;box-shadow:0 14px 30px rgba(0,40,110,.18)}
#l1sug div{padding:11px 16px;display:flex;justify-content:space-between;cursor:pointer}
#l1sug div:hover,#l1sug div.sel{background:#FFF6C2}
#l1fav{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
#l1fav button{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}
#l1fav button:hover{border-color:var(--acc)}
#l1tbl{flex:1;overflow:auto}
#l1tbl tbody tr{cursor:pointer}
#l1tbl tbody tr:nth-child(even) td{background:var(--panel2)}
#l1tbl tr.sel td{background:#FFF6C2!important}
#l1tot{padding:22px;background:var(--acc);border-color:var(--acc);color:#fff}
#l1tot .mut{color:#BCD0F2}
#l1tot .big{display:inline-block;margin:8px 0 6px;background:var(--hl);color:#0B1A33;font-size:54px;font-weight:800;letter-spacing:-1.5px;font-stretch:85%;line-height:1;padding:14px 22px 14px 40px;clip-path:polygon(22px 0,100% 0,100% 100%,22px 100%,0 50%);position:relative}
#l1tot .big::before{content:'';position:absolute;left:16px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--acc);transform:translateY(-50%)}
#l1tot .sum{margin-top:14px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.keys button{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:13px 12px;text-align:left;font-weight:700;font-size:14px}
.keys button:hover{border-color:var(--acc)}
.keys button kbd{display:inline-block;background:var(--txt);color:#fff;border-radius:6px;padding:2px 7px;font-size:12px;margin-right:8px;font-family:inherit;font-weight:800}
.keys .pay{grid-column:span 2;background:var(--hl);border-color:var(--hl);font-size:22px;text-align:center;padding:18px;font-weight:800}
.keys .pay:hover{border-color:var(--txt)}

/* ===== 2 BALCÃO ===== */
#v2 .cats{width:112px;background:var(--rail);display:flex;flex-direction:column;gap:6px;padding:10px 8px;overflow:auto}
#v2 .cats button{color:var(--railtxt);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700}
#v2 .cats button span{font-size:32px}
#v2 .cats button.on{background:var(--acc);color:#fff}
#v2 .menu{flex:1;overflow:auto;padding:20px}
#v2 .menu h2{font-size:32px;font-weight:800;margin-bottom:16px;letter-spacing:-1px;font-stretch:85%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px}
.prod{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s;position:relative}
.prod:hover{border-color:var(--acc);transform:translateY(-2px)}
.prod .img{font-size:58px;height:88px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-radius:14px}
.prod b{font-size:16px}
.prod .p{font-weight:800;color:var(--acc);font-size:19px}
.prod .tag{position:absolute;top:10px;right:10px;background:#16a34a;color:#fff;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:800}
#v2 .order{width:370px;background:#fff;border-left:2px solid var(--line);display:flex;flex-direction:column}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
#l2items{flex:1;overflow:auto;padding:0 16px}
.oi{display:flex;gap:10px;padding:12px 0;border-bottom:2px dashed var(--line);align-items:flex-start}
.oi .e{font-size:30px}
.oi .d{flex:1;min-width:0}
.oi .d small{display:block;color:var(--mut);font-size:12px;line-height:1.35}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--panel2);font-weight:800}
#l2foot{padding:16px;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.bigbtn{background:var(--acc);color:#fff;border-radius:16px;padding:18px;font-size:19px;font-weight:800;display:flex;justify-content:space-between}
.bigbtn:disabled{opacity:.4}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.opt label{border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;user-select:none}
.opt input{display:none}
.opt label:has(input:checked){border-color:var(--acc);background:var(--panel2)}

/* ===== 3 RESTAURANTE ===== */
#v3{flex-direction:column}
#v3 .sub{display:flex;gap:10px;padding:12px 18px;align-items:center;background:var(--panel);border-bottom:2px solid var(--line)}
#v3 .sub .seg{width:300px}
#v3 .body{flex:1;display:flex;overflow:hidden}
#l3map{flex:1;padding:22px;overflow:auto;background:radial-gradient(circle,#cfd9cb 1.2px,transparent 1.3px) 0 0/22px 22px}
.legend{display:flex;gap:16px;margin-bottom:18px;font-size:13px;color:var(--mut);font-weight:600}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid var(--line)}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:30px 30px;padding:10px}
.tb{aspect-ratio:1;border-radius:50%;background:#fff;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;position:relative;box-shadow:0 0 0 7px var(--bg),0 0 0 9px var(--line)}
.tb .n{font-size:30px;font-weight:800;letter-spacing:-1px;font-stretch:80%;line-height:1}
.tb small{color:var(--mut);font-size:12px}
.tb .mono{font-size:14px}
.tb.ocup{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 0 7px var(--bg),0 0 0 9px var(--acc)}
.tb.ocup small{color:#CFE5D8}
.tb.conta{background:var(--hl);border-color:var(--hl);color:#3a2700;box-shadow:0 0 0 7px var(--bg),0 0 0 9px var(--hl)}
.tb.conta small{color:#6b4a00}
.tb.sel{box-shadow:0 0 0 7px var(--bg),0 0 0 11px var(--txt)}
.tb>div{display:flex;flex-direction:column;align-items:center}
.tb>div:first-child{flex-direction:row;gap:6px;align-items:baseline}
#l3panel{width:430px;background:var(--panel);display:flex;flex-direction:column;border-left:2px solid var(--line);position:relative}
#l3panel::before{content:'';position:absolute;left:-9px;top:0;bottom:0;width:9px;background:radial-gradient(circle at 0 9px,var(--bg) 4px,transparent 4.5px) 0 0/9px 18px}
#l3panel .hd{padding:16px 18px;border-bottom:2px dashed var(--line)}
#l3panel .hd b{font-stretch:85%;letter-spacing:-.5px;font-size:24px!important}
#l3quick{padding:12px 18px;border-bottom:2px dashed var(--line)}
#l3quick .cs{display:flex;gap:6px;overflow:auto;margin:10px 0}
#l3quick .cs button{white-space:nowrap;padding:6px 12px;border-radius:99px;background:var(--panel2);font-size:13px;font-weight:700;color:var(--mut)}
#l3quick .cs button.on{background:var(--rail);color:#fff}
#l3quick .ps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:156px;overflow:auto}
#l3quick .ps button{background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:8px;font-size:13px;text-align:left;font-weight:600}
#l3quick .ps button:hover{border-color:var(--acc)}
#l3quick .ps button b{display:block;color:var(--acc);font-size:13px}
#l3items{flex:1;overflow:auto;padding:4px 18px}
.ci{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.ci .st{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700}
.st.pend{background:#FCEBC6;color:#8a5a00}.st.env{background:#D8EBDF;color:var(--acc)}
#l3foot{padding:14px 18px;border-top:2px dashed var(--line);display:flex;flex-direction:column;gap:8px;background:var(--panel2)}
.kanban{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:18px;overflow:auto}
.col{display:flex;flex-direction:column;min-height:0}
.col h3{padding:6px 4px 12px;font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.col .list{display:flex;flex-direction:column;gap:14px;overflow:auto;padding-bottom:10px}
.dc{background:#fff;padding:14px 14px 16px;display:flex;flex-direction:column;gap:7px;font-size:14px;position:relative;border-radius:4px 4px 0 0;
 -webkit-mask:radial-gradient(circle at 6px 100%,transparent 5px,#000 5.5px) 0 0/12px 100% repeat-x;mask:radial-gradient(circle at 6px 100%,transparent 5px,#000 5.5px) 0 0/12px 100% repeat-x;padding-bottom:20px}
.dc .top{display:flex;justify-content:space-between;align-items:center}
.ch-ifood{background:#ea1d2c;color:#fff;border:0}.ch-whats{background:#25d366;color:#04210f;border:0}.ch-site{background:#3b82f6;color:#fff;border:0}.ch-tel{background:#64748b;color:#fff;border:0}
.timer{font-size:12px;color:var(--mut);font-weight:600}
.timer.late{color:var(--dang);font-weight:800}

/* ===== 4 OFICINA ===== */
#v4 .oslist{width:300px;display:flex;flex-direction:column;background:var(--rail);color:var(--railtxt)}
#v4 .oslist .hd{padding:14px;display:flex;gap:8px}
#v4 .oslist input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff}
#l4list{overflow:auto;flex:1;padding:0 10px 10px}
.osc{padding:14px;border-radius:12px;cursor:pointer;margin-bottom:6px;border:2px solid transparent}
.osc:hover{background:rgba(255,255,255,.06)}
.osc.sel{background:rgba(255,255,255,.1);border-color:var(--hl)}
.osc .mut{color:#93A1B5}
.osc .chip{background:rgba(255,255,255,.1);border:0;color:#fff}
.plate{display:inline-block;background:#fff;color:#111;font-weight:800;padding:2px 9px;border-radius:5px;border:2px solid #111;border-top:6px solid #1d4ed8;font-size:14px;letter-spacing:2px;font-stretch:80%}
#l4form{flex:1;overflow:auto;padding:0 26px 26px}
#l4form>div:first-child{margin:0 -26px;padding:18px 26px;background:var(--panel);border-bottom:2px solid var(--line);position:relative}
#l4form>div:first-child::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:8px;background:repeating-linear-gradient(-45deg,var(--hl) 0 12px,var(--rail) 12px 24px)}
#l4form h2{font-size:30px!important;font-weight:800;letter-spacing:-1px;font-stretch:85%}
#l4form>div:first-child .plate{font-size:28px!important;padding:6px 18px!important;border-top-width:10px}
.steps{display:flex;gap:6px;margin:26px 0 22px}
.steps button{flex:1;padding:12px 6px;background:var(--panel);border:2px solid var(--line);font-size:14px;font-weight:700;color:var(--mut);border-radius:10px}
.steps button.done{background:#DCE6FB;border-color:#DCE6FB;color:var(--acc)}
.steps button.cur{background:var(--acc);border-color:var(--acc);color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.fgrid label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:5px;font-weight:700}
.fgrid label input,.fgrid label select{font-size:15px;font-weight:500;color:var(--txt)}
#l4new{white-space:nowrap;background:var(--hl);border-color:var(--hl);color:#111}
.sec{margin-top:24px}
.sec h3{font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.sec h3 select{font-size:14px;font-weight:600}
.sec table{background:var(--panel);border:2px solid var(--line);border-radius:12px;overflow:hidden;border-collapse:separate;border-spacing:0}
.sec td input{padding:6px 9px;border-width:1px}
.x{color:var(--dang);font-weight:800;padding:4px 8px}
#l4side{width:310px;background:var(--panel);border-left:2px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,20,30,.55);display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#mbox{background:var(--panel);color:var(--txt);border-radius:22px;width:min(580px,94vw);max-height:92vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.35);border-top:8px solid var(--acc)}
#mbox h2{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px;display:flex;justify-content:space-between}
.pm{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.pm button{border:2px solid var(--line);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;background:var(--panel)}
.pm button span{font-size:24px}
.pm button.on{border-color:var(--acc);background:var(--panel2)}
.paybox{background:var(--panel2);border-radius:14px;padding:14px 16px;margin:10px 0}
.paybox .row b{font-size:17px}
.qr{width:150px;height:150px;display:grid;grid-template-columns:repeat(21,1fr);background:#fff;padding:8px;border-radius:8px;margin:8px auto;border:2px solid var(--line)}
.qr i{background:#000}
.receipt{background:#fffef6;color:#222;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:18px;border-radius:6px;line-height:1.5;white-space:pre-wrap;max-height:55vh;overflow:auto;border:1px solid #e6e1cf}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--rail);color:#fff;padding:12px 20px;border-radius:12px;z-index:99;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.3s}
@media(max-width:1000px){#v1 .right{width:310px}#v2 .order{width:300px}#l3panel{width:350px}#l4side{display:none}.fgrid{grid-template-columns:1fr 1fr}.kanban{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="l1">

<div id="top">
  <div class="logo">PDV<b>.</b>flex</div>
  <div id="tabs">
    <button data-l="1" class="on">🛒 Caixa Rápido</button>
    <button data-l="2">🍔 Balcão Touch</button>
    <button data-l="3">🍽️ Mesas & Delivery</button>
    <button data-l="4">🔧 Oficina / OS</button>
  </div>
  <div class="info"><span><span class="dot"></span>Caixa 1, operadora Ana</span><span id="clock" class="mono"></span></div>
</div>

<main>
<!-- ================= 1 ================= -->
<section id="v1" class="view on">
  <div class="left">
    <div id="l1last" class="card"><div><div class="mut" style="font-size:13px">Último item</div><div class="n" id="l1lastn">CAIXA LIVRE</div></div><div class="v mono" id="l1lastv"></div></div>
    <div class="card" style="position:relative">
      <div id="l1search"><span class="ico">⌁</span><input id="l1in" placeholder="Código de barras ou nome do produto  (ex: 3*7891000100103)" autocomplete="off"><span id="l1qtd"></span>
        <div id="l1sug"></div></div>
      <div id="l1fav"></div>
    </div>
    <div class="card" id="l1tbl"></div>
  </div>
  <div class="right">
    <div class="card" id="l1tot"></div>
    <div class="card keys">
      <button data-k="F2"><kbd>F2</kbd>Buscar</button>
      <button data-k="F3"><kbd>F3</kbd>Quantidade</button>
      <button data-k="F4"><kbd>F4</kbd>Desconto</button>
      <button data-k="F6"><kbd>F6</kbd>Cancelar item</button>
      <button data-k="F8"><kbd>F8</kbd>CPF na nota</button>
      <button data-k="Escape"><kbd>ESC</kbd>Cancelar venda</button>
      <button data-k="F10" class="pay"><kbd>F10</kbd>Pagamento</button>
    </div>
  </div>

<script>
/* ================= utilidades ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let layout=1;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),300)},1600)}
setInterval(()=>$('#clock').textContent=new Date().toLocaleString('pt-BR'),1000);

/* modal genérico */
function modal(html){$('#mbox').innerHTML=html;$('#modal').classList.add('on');const f=$('#mbox [autofocus]');if(f)setTimeout(()=>{f.focus();f.select&&f.select()},30)}
function closeModal(){$('#modal').classList.remove('on')}
const modalOpen=()=>$('#modal').classList.contains('on');
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
function ask(title,def='',hint=''){return new Promise(res=>{
  modal(`<h2>${title}<button onclick="closeModal()">✕</button></h2>${hint?`<p class="mut" style="margin-bottom:10px">${hint}</p>`:''}
  <form id="askf"><input id="askv" value="${esc(def)}" autofocus style="font-size:20px;padding:12px"><div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri">Confirmar</button></div></form>`);
  $('#askf').onsubmit=e=>{e.preventDefault();const v=$('#askv').value;closeModal();res(v)};
})}

/* ================= pagamento compartilhado ================= */
const METODOS=[['din','💵','Dinheiro'],['pix','⚡','PIX'],['cre','💳','Crédito'],['deb','💳','Débito'],['vr','🎫','Vale-ref.']];
let pay=null;
function openPayment(venda,onDone){
  pay={venda,onDone,parts:[],met:'pix'};renderPay();
}
function renderPay(){
  const {venda,parts}=pay;const pago=parts.reduce((a,p)=>a+p.v,0);const falta=Math.max(0,+(venda.total-pago).toFixed(2));
  const troco=Math.max(0,pago-venda.total);
  modal(`<h2>Pagamento <button onclick="closeModal()">✕</button></h2>
  <div class="paybox"><div class="row"><span>Total da venda</span><b class="mono">${brl(venda.total)}</b></div>
  <div class="row"><span>Pago</span><b class="mono" style="color:var(--acc)">${brl(pago)}</b></div>
  <div class="row"><span>${troco>0?'Troco':'Falta'}</span><b class="mono" style="font-size:22px;color:${troco>0?'var(--warn)':'inherit'}">${brl(troco>0?troco:falta)}</b></div></div>
  ${falta>0?`<div class="pm">${METODOS.map(m=>`<button class="${pay.met===m[0]?'on':''}" onclick="pay.met='${m[0]}';renderPay()"><span>${m[1]}</span>${m[2]}</button>`).join('')}</div>
  ${pay.met==='pix'?`<div style="text-align:center"><div class="qr">${Array.from({length:441},(_,i)=>`<i style="opacity:${Math.random()>.5?1:0}"></i>`).join('')}</div><small class="mut">QR Code dinâmico (simulação) · confirme quando o cliente pagar</small></div>`:''}
  ${pay.met==='cre'||pay.met==='deb'?`<p class="mut" style="text-align:center;margin:6px 0">🔌 Aguardando maquininha TEF/POS… (simulação)</p>`:''}
  <form id="payf" style="display:flex;gap:8px;margin-top:10px"><input id="payv" class="mono" value="${falta.toFixed(2).replace('.',',')}" autofocus style="font-size:20px"><button class="btn pri" style="white-space:nowrap">+ Adicionar</button></form>`:''}
  ${parts.length?`<div style="margin-top:12px">${parts.map((p,i)=>`<div class="row" style="border-bottom:1px solid var(--line);padding:6px 0"><span>${METODOS.find(m=>m[0]===p.m)[1]} ${METODOS.find(m=>m[0]===p.m)[2]}</span><span class="mono">${brl(p.v)} <button class="x" onclick="pay.parts.splice(${i},1);renderPay()">✕</button></span></div>`).join('')}</div>`:''}
  <label style="display:block;margin-top:14px;font-size:12px" class="mut">CPF/CNPJ na nota (opcional)<input id="paycpf" value="${esc(venda.cpf||'')}" placeholder="000.000.000-00" style="margin-top:4px"></label>
  <button class="btn pri" style="width:100%;margin-top:14px;padding:16px;font-size:16px" ${falta>0?'disabled':''} onclick="finishPay()">✔ Concluir e emitir NFC-e</button>`);
  const f=$('#payf');if(f)f.onsubmit=e=>{e.preventDefault();const v=num($('#payv').value);if(v<=0)return;if(pay.met!=='din'&&v>falta+0.001){toast('Só dinheiro permite troco');return}pay.parts.push({m:pay.met,v});renderPay()};
}
function finishPay(){
  const cpf=$('#paycpf').value;const {venda,parts,onDone}=pay;const pago=parts.reduce((a,p)=>a+p.v,0);
  showReceipt({...venda,cpf,parts,troco:Math.max(0,pago-venda.total)});onDone&&onDone();
}
function showReceipt(v){
  const W=40,line='-'.repeat(W),pad=(a,b)=>a+' '.repeat(Math.max(1,W-a.length-b.length))+b;
  let t=`${'PDV.FLEX COMÉRCIO LTDA'.padStart(31)}\n${'CNPJ 00.000.000/0001-00'.padStart(31)}\n${line}\n${v.titulo||'CUPOM FISCAL ELETRÔNICO - NFC-e'}\n${new Date().toLocaleString('pt-BR')}\n`;
  if(v.cab)t+=v.cab+'\n';t+=line+'\n';
  v.itens.forEach((it,i)=>{t+=`${String(i+1).padStart(3,'0')} ${it.nome.slice(0,34)}\n`;if(it.obs)t+=`    ${it.obs.slice(0,35)}\n`;t+=pad(`    ${(+it.qtd).toLocaleString('pt-BR')} x ${brl(it.preco)}`,brl(it.qtd*it.preco))+'\n'});
  t+=line+'\n'+pad('SUBTOTAL',brl(v.sub))+'\n';
  if(v.desc)t+=pad('DESCONTO','-'+brl(v.desc))+'\n';
  if(v.acr)t+=pad(v.acrLabel||'ACRÉSCIMO',brl(v.acr))+'\n';
  t+=pad('TOTAL',brl(v.total))+'\n';
  (v.parts||[]).forEach(p=>t+=pad('  '+METODOS.find(m=>m[0]===p.m)[2].toUpperCase(),brl(p.v))+'\n');
  if(v.troco)t+=pad('TROCO',brl(v.troco))+'\n';
  t+=line+'\n'+(v.cpf?`CONSUMIDOR: ${v.cpf}\n`:'CONSUMIDOR NÃO IDENTIFICADO\n');
  if(v.rod)t+=line+'\n'+v.rod+'\n';
  t+=`\nChave: ${Array.from({length:11},()=>Math.floor(1000+Math.random()*8999)).join(' ')}\n${'Obrigado pela preferência!'.padStart(32)}`;
  modal(`<h2>${v.parts?'✅ Venda concluída':'📄 Documento'} <button onclick="closeModal()">✕</button></h2><div class="receipt">${esc(t)}</div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="try{navigator.clipboard.writeText(document.querySelector('.receipt').innerText).then(()=>toast('Cupom copiado'),()=>toast('Não foi possível copiar'))}catch(e){toast('Não foi possível copiar')}">📋 Copiar cupom</button><button class="btn pri" style="flex:1" onclick="closeModal()" autofocus>Nova venda</button></div>`);
}

/* ================= troca de layout ================= */
$$('#tabs button').forEach(b=>b.onclick=()=>setLayout(+b.dataset.l));
function setLayout(n){layout=n;document.body.className='l'+n;$$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.l===n));$$('.view').forEach((v,i)=>v.classList.toggle('on',i+1===n));if(n===1)$('#l1in').focus()}

/* =====================================================================
   LAYOUT 1 — CAIXA RÁPIDO (supermercado, padaria, conveniência)
===================================================================== */
const MERC=[
 ['7891000100103','Leite Integral 1L',5.49,'UN'],['7896004000206','Arroz Branco Tipo 1 5kg',27.90,'UN'],['7896006700101','Feijão Carioca 1kg',8.79,'UN'],
 ['7891910000197','Açúcar Refinado 1kg',4.99,'UN'],['7891149103102','Café Torrado 500g',18.90,'UN'],['7894900011517','Refrigerante Cola 2L',9.99,'UN'],
 ['7891024134702','Sabonete 90g',2.49,'UN'],['7891150037601','Detergente 500ml',2.79,'UN'],['7896045104123','Óleo de Soja 900ml',7.49,'UN'],
 ['7891000053508','Chocolate ao Leite 90g',6.49,'UN'],['7896036090244','Macarrão Espaguete 500g',4.29,'UN'],['7891991010856','Cerveja Lata 350ml',3.99,'UN'],
 ['2000001','Banana Prata',6.99,'KG'],['2000002','Tomate',8.49,'KG'],['2000003','Pão Francês',16.90,'KG'],['2000004','Queijo Muçarela',49.90,'KG'],
 ['2000005','Presunto Fatiado',39.90,'KG'],['7898080640017','Iogurte Morango 170g',3.29,'UN'],['7891000315507','Biscoito Recheado 140g',3.79,'UN'],['7896102000122','Papel Higiênico 12 rolos',21.90,'UN']
].map(([cod,nome,preco,un])=>({cod,nome,preco,un}));
const FAV=['2000003','2000001','7891000100103','7891991010856','7894900011517','2000004'];
const l1={itens:[],desc:0,cpf:'',qtd:null,sel:-1,sug:[],sugI:0};
const l1sub=()=>l1.itens.reduce((a,i)=>a+i.qtd*i.preco,0);
const l1in=$('#l1in');
$('#l1fav').innerHTML='<span class="mut" style="font-size:12px;align-self:center">Atalhos:</span>'+FAV.map(c=>{const p=MERC.find(x=>x.cod===c);return `<button onclick="l1Pick('${c}')">${p.nome}</button>`}).join('');
async function l1Pick(cod,qtd){
  const p=MERC.find(x=>x.cod===cod);if(!p)return;
  if(qtd==null)qtd=l1.qtd;
  if(qtd==null&&p.un==='KG'){const v=await ask('⚖️ Peso — '+p.nome,'0,500','Informe o peso da balança (kg)');qtd=num(v);if(!qtd)return l1in.focus()}
  qtd=qtd||1;l1.itens.push({...p,qtd});l1.qtd=null;l1.sel=l1.itens.length-1;l1in.value='';hideSug();l1Render();l1in.focus();
}
function hideSug(){$('#l1sug').style.display='none';l1.sug=[]}
l1in.addEventListener('input',()=>{
  let v=l1in.value.trim();const m=v.match(/^(\d+(?:[.,]\d+)?)\*(.*)$/);if(m)v=m[2];
  if(v.length<2||/^\d+$/.test(v)){hideSug();return}
  l1.sug=MERC.filter(p=>p.nome.toLowerCase().includes(v.toLowerCase())).slice(0,7);l1.sugI=0;drawSug();
});
function drawSug(){const s=$('#l1sug');if(!l1.sug.length){hideSug();return}s.style.display='block';s.innerHTML=l1.sug.map((p,i)=>`<div class="${i===l1.sugI?'sel':''}" onmousedown="l1Pick('${p.cod}',l1Q())"><span>${p.nome} <small class="mut mono">${p.cod}</small></span><b class="mono">${brl(p.preco)}/${p.un.toLowerCase()}</b></div>`).join('')}
function l1Q(){const m=l1in.value.match(/^(\d+(?:[.,]\d+)?)\*/);return m?num(m[1]):undefined}
l1in.addEventListener('keydown',e=>{
  if(l1.sug.length&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();l1.sugI=(l1.sugI+(e.key==='ArrowDown'?1:-1)+l1.sug.length)%l1.sug.length;drawSug();return}
  if(e.key!=='Enter')return;
  if(l1.sug.length){l1Pick(l1.sug[l1.sugI].cod,l1Q());return}
  let v=l1in.value.trim();if(!v){if(l1.itens.length)l1Key('F10');return}
  let q;const m=v.match(/^(\d+(?:[.,]\d+)?)\*(.*)$/);if(m){q=num(m[1]);v=m[2]}
  const p=MERC.find(x=>x.cod===v);if(p)l1Pick(p.cod,q);else{toast('Produto não encontrado: '+v);l1in.select()}
});
function l1Render(){
  const sub=l1sub(),tot=Math.max(0,sub-l1.desc),last=l1.itens[l1.itens.length-1];
  $('#l1lastn').textContent=last?`${last.nome}`:'CAIXA LIVRE';
  $('#l1lastv').textContent=last?`${(+last.qtd).toLocaleString('pt-BR')} ${last.un.toLowerCase()} × ${brl(last.preco)} = ${brl(last.qtd*last.preco)}`:'';
  $('#l1qtd').style.display=l1.qtd?'block':'none';$('#l1qtd').textContent='QTD × '+l1.qtd;
  $('#l1tbl').innerHTML=l1.itens.length?`<table><thead><tr><th>#</th><th>Código</th><th>Descrição</th><th class="r">Qtd</th><th>Un</th><th class="r">Vl. unit</th><th class="r">Total</th></tr></thead><tbody>${l1.itens.map((i,k)=>`<tr class="${k===l1.sel?'sel':''}" onclick="l1.sel=${k};l1Render()"><td class="mut">${String(k+1).padStart(3,'0')}</td><td class="mono mut">${i.cod}</td><td><b>${i.nome}</b></td><td class="r mono">${(+i.qtd).toLocaleString('pt-BR',{maximumFractionDigits:3})}</td><td class="mut">${i.un}</td><td class="r mono">${brl(i.preco)}</td><td class="r mono"><b>${brl(i.qtd*i.preco)}</b></td></tr>`).join('')}</tbody></table>`
   :`<div class="empty"><div class="e">▦</div><b>Passe o produto no leitor</b><span>ou digite o código / nome · use <kbd class="mono">3*código</kbd> para quantidade<br>Teste: 7891000100103 · 2000003 (pesável) · "café"</span></div>`;
  const vol=l1.itens.reduce((a,i)=>a+(i.un==='UN'?i.qtd:1),0);
  $('#l1tot').innerHTML=`<div class="mut" style="font-size:15px;font-weight:600">Total a pagar</div><div class="big mono">${brl(tot)}</div>
   <div class="sum">
   <div class="row"><span class="mut">Itens / volumes</span><span class="mono">${l1.itens.length} / ${vol}</span></div>
   <div class="row"><span class="mut">Subtotal</span><span class="mono">${brl(sub)}</span></div>
   <div class="row"><span class="mut">Desconto</span><span class="mono">-${brl(l1.desc)}</span></div>
   <div class="row"><span class="mut">Cliente</span><span class="mono">${l1.cpf||'—'}</span></div></div>`;
}
async function l1Key(k){
  if(k==='F2'){l1in.focus();l1in.select()}
  if(k==='F3'){const v=await ask('Quantidade do próximo item','2');l1.qtd=num(v)||null;l1Render();l1in.focus()}
  if(k==='F4'){if(!l1.itens.length)return;const v=await ask('Desconto na venda','10%','Valor em R$ ou percentual (ex: 5,00 ou 10%)');const s=l1sub();l1.desc=v.includes('%')?+(s*num(v)/100).toFixed(2):num(v);l1.desc=Math.min(l1.desc,s);l1Render();l1in.focus()}
  if(k==='F6'){if(!l1.itens.length)return;const i=l1.sel>=0?l1.sel:l1.itens.length-1;const it=l1.itens.splice(i,1)[0];toast('Item cancelado: '+it.nome);l1.sel=l1.itens.length-1;l1Render();l1in.focus()}
  if(k==='F8'){l1.cpf=await ask('CPF/CNPJ na nota',l1.cpf);l1Render();l1in.focus()}
  if(k==='Escape'){if(l1.qtd){l1.qtd=null;l1Render();return}if(l1.itens.length){modal(`<h2>Cancelar a venda inteira?<button onclick="closeModal()">✕</button></h2><p class="mut">${l1.itens.length} item(ns) serão removidos.</p><div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end"><button class="btn" onclick="closeModal()" autofocus>Voltar</button><button class="btn dang" onclick="Object.assign(l1,{itens:[],desc:0,cpf:''});l1Render();closeModal();l1in.focus()">Cancelar venda</button></div>`)}}
  if(k==='F10'){if(!l1.itens.length)return toast('Nenhum item na venda');const sub=l1sub();
    openPayment({itens:l1.itens.map(i=>({nome:i.nome,qtd:i.qtd,preco:i.preco})),sub,desc:l1.desc,total:+(sub-l1.desc).toFixed(2),cpf:l1.cpf},()=>{Object.assign(l1,{itens:[],desc:0,cpf:'',sel:-1});l1Render()})}
}
$$('#v1 .keys button').forEach(b=>b.onclick=()=>l1Key(b.dataset.k));
document.addEventListener('keydown',e=>{
  if(modalOpen()){if(e.key==='Escape')closeModal();return}
  if(layout===1&&['F2','F3','F4','F6','F8','F10','Escape'].includes(e.key)){e.preventDefault();l1Key(e.key)}
});

    if(fd.get('tam')!=null){const t=(p.t==='combo'?OPT.combo:OPT.tam)[+fd.get('tam')];v+=t[1];o.push(t[0])}

  $('#l4form').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div><span class="mut">Ordem de serviço</span><h2 style="font-size:24px">OS #${o.n}</h2></div><span class="plate" style="font-size:20px;padding:4px 14px">${esc(o.placa)||'———'}</span></div>
   <div class="steps">${ST4.map((s,i)=>`<button class="${i<o.st?'done':i===o.st?'cur':''}" onclick="l4St(${i})">${i<o.st?'✓ ':''}${s}</button>`).join('')}</div>
   <div class="fgrid">${f('cli','Cliente','Nome / razão social')}${f('tel','Telefone / WhatsApp','(00) 00000-0000')}${f('placa','Placa','ABC1D23')}${f('vei','Veículo','Marca modelo ano')}
   ${f('km','KM atual')}<label>Mecânico<select data-f="mec">${MEC.map(m=>`<option ${m===o.mec?'selected':''}>${m}</option>`).join('')}</select></label>
   <label style="grid-column:span 2">Defeito relatado<input data-f="def" value="${esc(o.def)}"></label></div>
   <div class="sec"><h3>🔧 Serviços / mão de obra <select id="l4adds" style="width:auto"><option value="">+ adicionar serviço…</option>${SERV.map((s,i)=>`<option value="${i}">${s[0]} — ${brl(s[2])}</option>`).join('')}<option value="x">Outro (livre)</option></select></h3>
    <table><thead><tr><th>Descrição</th><th class="r" style="width:90px">Horas</th><th class="r" style="width:130px">Valor</th><th style="width:40px"></th></tr></thead><tbody>${o.serv.map((s,i)=>`<tr><td><input data-s="${i}" data-k="d" value="${esc(s.d)}"></td><td><input class="mono r" data-s="${i}" data-k="h" value="${s.h}"></td><td><input class="mono r" data-s="${i}" data-k="v" value="${s.v}"></td><td><button class="x" onclick="l4.os[l4.sel].serv.splice(${i},1);l4Render()">✕</button></td></tr>`).join('')||'<tr><td colspan=4 class="mut">Nenhum serviço</td></tr>'}</tbody></table></div>
   <div class="sec"><h3>📦 Peças <select id="l4addp" style="width:auto"><option value="">+ adicionar peça…</option>${PECAS.map((p,i)=>`<option value="${i}">${p[0]} · ${p[1]} — ${brl(p[2])}</option>`).join('')}</select></h3>
    <table><thead><tr><th style="width:100px">Código</th><th>Descrição</th><th class="r" style="width:70px">Qtd</th><th class="r" style="width:110px">Unit.</th><th class="r" style="width:110px">Total</th><th style="width:40px"></th></tr></thead><tbody>${o.pecas.map((p,i)=>`<tr><td class="mono mut">${p.c}</td><td>${p.d}</td><td><input class="mono r" data-p="${i}" data-k="q" value="${p.q}"></td><td><input class="mono r" data-p="${i}" data-k="v" value="${p.v}"></td><td class="r mono">${brl(p.q*p.v)}</td><td><button class="x" onclick="l4.os[l4.sel].pecas.splice(${i},1);l4Render()">✕</button></td></tr>`).join('')||'<tr><td colspan=6 class="mut">Nenhuma peça</td></tr>'}</tbody></table></div>`;
  const T=tot4(o);
  $('#l4side').innerHTML=`<b style="font-size:16px">Resumo</b>
   <div class="row"><span class="mut">Mão de obra</span><span class="mono">${brl(T.s)}</span></div>
   <div class="row"><span class="mut">Peças</span><span class="mono">${brl(T.p)}</span></div>
   <div class="row" style="border-top:1px solid var(--line);padding-top:10px;font-size:24px;font-weight:900"><span>Total</span><span class="mono" style="color:var(--acc)">${brl(T.t)}</span></div>
   <button class="btn" onclick="l4Doc()">🖨️ Imprimir orçamento</button>
   <button class="btn" onclick="toast('📲 Orçamento enviado por WhatsApp para ${esc(o.tel)} (simulação)')">📲 Enviar p/ WhatsApp</button>
   ${o.st===0?`<button class="btn" style="border-color:#16a34a;color:#16a34a" onclick="l4St(1)">✔ Cliente aprovou</button>`:''}
   <button class="btn pri" style="padding:14px" ${T.t?'':'disabled'} onclick="l4Pay()">💳 Faturar OS</button>
   <div class="mut" style="font-size:12px;margin-top:auto;line-height:1.6">📅 Aberta hoje às 08:42<br>🛡️ Garantia: 90 dias serviços / 3 meses peças<br>🔔 Avisar cliente quando "Pronto"</div>`;
  $$('#l4form [data-f]').forEach(e=>e.onchange=()=>{o[e.dataset.f]=e.dataset.f==='placa'?e.value.toUpperCase():e.value;l4Render()});
  $$('#l4form [data-s]').forEach(e=>e.onchange=()=>{const s=o.serv[+e.dataset.s];s[e.dataset.k]=e.dataset.k==='d'?e.value:num(e.value);l4Render()});
  $$('#l4form [data-p]').forEach(e=>e.onchange=()=>{o.pecas[+e.dataset.p][e.dataset.k]=num(e.value);l4Render()});
  $('#l4adds').onchange=e=>{const v=e.target.value;if(v==='')return;o.serv.push(v==='x'?{d:'Serviço',h:1,v:0}:{d:SERV[v][0],h:SERV[v][1],v:SERV[v][2]});l4Render()};
  $('#l4addp').onchange=e=>{const v=e.target.value;if(v==='')return;const p=PECAS[v],ex=o.pecas.find(x=>x.c===p[0]);ex?ex.q++:o.pecas.push({c:p[0],d:p[1],q:1,v:p[2]});l4Render()};
}
function l4St(i){const o=l4.os[l4.sel];o.st=i;l4Render();if(i===3)toast(`📲 Cliente ${o.cli} avisado: veículo pronto`)}
function l4Venda(o){const T=tot4(o);return{itens:[...o.serv.map(s=>({nome:'[S] '+s.d,qtd:1,preco:+s.v})),...o.pecas.map(p=>({nome:'[P] '+p.d,qtd:p.q,preco:p.v}))],sub:T.t,total:T.t,
  cab:`OS #${o.n} · ${o.placa} · ${o.vei}\nCLIENTE: ${o.cli}\nKM: ${o.km} · MECÂNICO: ${o.mec}`}}
function l4Doc(){const o=l4.os[l4.sel];showReceipt({...l4Venda(o),titulo:'ORÇAMENTO — VÁLIDO POR 7 DIAS',rod:'Autorizo a execução dos serviços acima.\n\n______________________________\nAssinatura do cliente'})}
function l4Pay(){const o=l4.os[l4.sel];openPayment({...l4Venda(o),titulo:'NFS-e / NF-e (serviços e peças)'},()=>{o.st=4;l4Render()})}
$('#l4q').oninput=e=>{l4.q=e.target.value;l4Render()};
$('#l4new').onclick=()=>{l4.os.unshift({n:++l4.seq,cli:'',tel:'',placa:'',vei:'',km:'',mec:'—',st:0,def:'',serv:[],pecas:[]});l4.sel=0;l4Render();$('#l4form [data-f=cli]').focus()};
l4Render();
l1in.focus();
</script>
</body>
</html>

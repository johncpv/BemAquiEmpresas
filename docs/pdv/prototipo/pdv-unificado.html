<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDV BemAqui</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--r:14px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-optical-sizing:auto}
body,body.l1{--bg:#EAF0F8;--panel:#fff;--panel2:#F3F6FB;--line:#D6DFEC;--txt:#0B1A33;--mut:#5A6A85;--acc:#0047BB;--hl:#FFD400;--rail:#0047BB;--railtxt:#fff;--warn:#B45309;--dang:#D92D20}
body{background:var(--bg,#EAF0F8);color:var(--txt);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-size:15px;transition:background .25s;font-family:'Bricolage Grotesque',system-ui,sans-serif}
body.l2{--bg:#fff7ef;--panel:#fff;--panel2:#fff1e3;--line:#f1dcc7;--txt:#2b1a0e;--mut:#8a6c55;--acc:#e8590c;--hl:#FFC93C;--rail:#2b1a0e;--railtxt:#f5d9c2;--warn:#B45309;--dang:#D92D20}
body.l3{--bg:#E8EDE6;--panel:#fff;--panel2:#F1F4EF;--line:#D2DBCE;--txt:#18291F;--mut:#5C6E61;--acc:#1E5B3F;--hl:#F2B33D;--rail:#163527;--railtxt:#E3EEE6;--warn:#B7791F;--dang:#C2362B}
body.l4{--bg:#E4E8EE;--panel:#fff;--panel2:#F0F3F7;--line:#CBD3DE;--txt:#141E2B;--mut:#566376;--acc:#1D4ED8;--hl:#FFC400;--rail:#141E2B;--railtxt:#DCE3EC;--warn:#B45309;--dang:#D92D20}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--acc)}
.mono{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.small{font-size:12.5px}
.btn{background:var(--panel);border:2px solid var(--line);padding:11px 16px;border-radius:12px;font-weight:700}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dang{background:transparent;border-color:var(--dang);color:var(--dang)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.okc{background:#DCF3E4;color:#14532d;border-color:#BFE6CC}
.warnc{background:#FCEBC6;color:#8a5a00;border-color:#F3D9A0}
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--r)}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0}
.r{text-align:right}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--mut);gap:8px;padding:30px;text-align:center}
.empty .e{font-size:46px}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:12px;color:var(--mut);padding:10px 14px;border-bottom:2px solid var(--line);font-weight:700}
td{padding:11px 14px;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto;max-width:100%}

/* topo */
#hdr{background:var(--rail);color:var(--railtxt);flex-shrink:0;transition:background .25s}
#top{display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--rail);color:var(--railtxt);transition:background .25s;min-width:0}
#top .logo{font-weight:800;font-size:20px;letter-spacing:-.5px;font-stretch:80%;flex-shrink:0}
#top .logo b{color:var(--hl)}
#perfilBtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:12px;padding:5px 12px 5px 8px;color:var(--railtxt);text-align:left;flex-shrink:0}
#perfilBtn:hover{background:rgba(255,255,255,.18)}
#perfilBtn .pe{font-size:22px}
#perfilBtn small{display:block;font-size:10.5px;opacity:.75;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
#perfilBtn b{font-size:14px;white-space:nowrap}
#tabs{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:12px;min-width:0;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{padding:8px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--railtxt);opacity:.75;white-space:nowrap}
#tabs button.on{background:var(--hl);color:#1a1a1a;opacity:1}
#tabs .cnt{display:inline-block;background:var(--dang);color:#fff;border-radius:99px;padding:0 7px;font-size:11px;margin-left:4px;opacity:1}
#status{display:flex;align-items:center;gap:8px;padding:6px 18px;background:rgba(0,0,0,.22);font-size:13px;flex-wrap:wrap}
.sb{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.09);color:var(--railtxt);font-weight:600;font-size:13px;white-space:nowrap}
button.sb:hover{background:rgba(255,255,255,.18)}
.sb .dot{width:9px;height:9px;border-radius:50%;background:#3BD16F;display:inline-block}
.sb.off{background:#F5A524;color:#231500}
.sb.off .dot{background:#8a2c00}
.sb.warn{background:#D92D20;color:#fff}
#clock{margin-left:auto;opacity:.8;white-space:nowrap}
main{flex:1;overflow:hidden;min-height:0}
.view{display:none;height:100%}
.view.on{display:flex}

/* ===== 1 CAIXA RÁPIDO ===== */
#v1{gap:14px;padding:14px}
#v1 .left{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
#v1 .right{width:380px;display:flex;flex-direction:column;gap:14px}
#l1last{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border-left:10px solid var(--hl)}
#l1last .n{font-size:26px;font-weight:800;letter-spacing:-.5px}
#l1last .v{font-size:22px;font-weight:700;color:var(--acc);text-align:right}
#l1search{position:relative;padding:14px}
#l1search input{font-size:22px;padding:16px 18px 16px 54px;border-width:3px;border-color:var(--acc);font-weight:600}
#l1search .ico{position:absolute;left:32px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--acc)}
#l1qtd{position:absolute;right:30px;top:50%;transform:translateY(-50%);background:var(--hl);font-weight:800;padding:4px 12px;border-radius:8px;display:none}
#l1sug{position:absolute;left:14px;right:14px;top:calc(100% - 8px);background:#fff;border:2px solid var(--acc);border-radius:12px;z-index:5;overflow:hidden;display:none;box-shadow:0 14px 30px rgba(0,40,110,.18)}
#l1sug div{padding:11px 16px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
#l1sug div:hover,#l1sug div.sel{background:#FFF6C2}
#l1fav{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
#l1fav button{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}
#l1fav button:hover{border-color:var(--acc)}
#l1tbl{flex:1;overflow:auto}
#l1tbl tbody tr{cursor:pointer}
#l1tbl tbody tr:nth-child(even) td{background:var(--panel2)}
#l1tbl tr.sel td{background:#FFF6C2!important}
#l1tot{padding:22px;background:var(--acc);border-color:var(--acc);color:#fff}
#l1tot .mut{color:#BCD0F2}
#l1tot .big{display:inline-block;margin:8px 0 6px;background:var(--hl);color:#0B1A33;font-size:54px;font-weight:800;letter-spacing:-1.5px;font-stretch:85%;line-height:1;padding:14px 22px 14px 40px;clip-path:polygon(22px 0,100% 0,100% 100%,22px 100%,0 50%);position:relative}
#l1tot .big::before{content:'';position:absolute;left:16px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--acc);transform:translateY(-50%)}
#l1tot .sum{margin-top:14px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.keys button{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:13px 12px;text-align:left;font-weight:700;font-size:14px}
.keys button:hover{border-color:var(--acc)}
.keys button kbd{display:inline-block;background:var(--txt);color:#fff;border-radius:6px;padding:2px 7px;font-size:12px;margin-right:8px;font-family:inherit;font-weight:800}
.keys .wide{grid-column:span 2}
.keys .pay{grid-column:span 2;background:var(--hl);border-color:var(--hl);font-size:22px;text-align:center;padding:18px;font-weight:800}
.keys .pay:hover{border-color:var(--txt)}

/* ===== 2 BALCÃO ===== */
#v2 .cats{width:112px;background:var(--rail);display:flex;flex-direction:column;gap:6px;padding:10px 8px;overflow:auto;flex-shrink:0}
#v2 .cats button{color:var(--railtxt);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700}
#v2 .cats button span{font-size:32px}
#v2 .cats button.on{background:var(--acc);color:#fff}
#v2 .menu{flex:1;overflow:auto;padding:20px;min-width:0}
#v2 .menu h2{font-size:32px;font-weight:800;margin-bottom:16px;letter-spacing:-1px;font-stretch:85%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px}
.prod{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s;position:relative;min-width:0}
.prod:hover{border-color:var(--acc);transform:translateY(-2px)}
.prod .img{font-size:58px;height:88px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-radius:14px}
.prod b{font-size:16px}
.prod .p{font-weight:800;color:var(--acc);font-size:19px}
.prod .tag{position:absolute;top:10px;right:10px;background:#16a34a;color:#fff;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:800}
#v2 .order{width:370px;background:#fff;border-left:2px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
#l2items{flex:1;overflow:auto;padding:0 16px}
.oi{display:flex;gap:10px;padding:12px 0;border-bottom:2px dashed var(--line);align-items:flex-start}
.oi .e{font-size:30px}
.oi .d{flex:1;min-width:0}
.oi .d small{display:block;color:var(--mut);font-size:12px;line-height:1.35}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--panel2);font-weight:800}
#l2foot{padding:16px;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.bigbtn{background:var(--acc);color:#fff;border-radius:16px;padding:18px;font-size:19px;font-weight:800;display:flex;justify-content:space-between;gap:10px}
.bigbtn:disabled{opacity:.4}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.opt label{border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;user-select:none}
.opt input{display:none}
.opt label:has(input:checked){border-color:var(--acc);background:var(--panel2)}
.sheet-h{display:none}

/* ===== 3 MESAS ===== */
#v3{flex-direction:column}
#v3 .sub{display:flex;gap:10px;padding:12px 18px;align-items:center;background:var(--panel);border-bottom:2px solid var(--line)}
#v3 .sub .seg{width:300px}
#v3 .body{flex:1;display:flex;overflow:hidden;min-height:0}
#l3map{flex:1;padding:22px;overflow:auto;background:radial-gradient(circle,#cfd9cb 1.2px,transparent 1.3px) 0 0/22px 22px;min-width:0}
.legend{display:flex;gap:16px;margin-bottom:18px;font-size:13px;color:var(--mut);font-weight:600;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid var(--line)}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:30px 30px;padding:10px}
.tb{aspect-ratio:1;border-radius:50%;background:#fff;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;position:relative;box-shadow:0 0 0 7px var(--bg),0 0 0 9px var(--line)}
.tb .n{font-size:30px;font-weight:800;letter-spacing:-1px;font-stretch:80%;line-height:1}
.tb small{color:var(--mut);font-size:12px}
.tb .mono{font-size:14px}
.tb.ocup{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 0 7px var(--bg),0 0 0 9px var(--acc)}
.tb.ocup small{color:#CFE5D8}
.tb.conta{background:var(--hl);border-color:var(--hl);color:#3a2700;box-shadow:0 0 0 7px var(--bg),0 0 0 9px var(--hl)}
.tb.conta small{color:#6b4a00}
.tb.sel{box-shadow:0 0 0 7px var(--bg),0 0 0 11px var(--txt)}
.tb>div{display:flex;flex-direction:column;align-items:center}
.tb>div:first-child{flex-direction:row;gap:6px;align-items:baseline}
#l3panel{width:430px;background:var(--panel);display:flex;flex-direction:column;border-left:2px solid var(--line);position:relative;flex-shrink:0}
#l3panel::before{content:'';position:absolute;left:-9px;top:0;bottom:0;width:9px;background:radial-gradient(circle at 0 9px,var(--bg) 4px,transparent 4.5px) 0 0/9px 18px}
#l3panel .hd{padding:16px 18px;border-bottom:2px dashed var(--line)}
#l3panel .hd b{font-stretch:85%;letter-spacing:-.5px;font-size:24px!important}
#l3quick{padding:12px 18px;border-bottom:2px dashed var(--line)}
#l3quick .cs{display:flex;gap:6px;overflow:auto;margin:10px 0}
#l3quick .cs button{white-space:nowrap;padding:6px 12px;border-radius:99px;background:var(--panel2);font-size:13px;font-weight:700;color:var(--mut)}
#l3quick .cs button.on{background:var(--rail);color:#fff}
#l3quick .ps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:156px;overflow:auto}
#l3quick .ps button{background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:8px;font-size:13px;text-align:left;font-weight:600}
#l3quick .ps button:hover{border-color:var(--acc)}
#l3quick .ps button b{display:block;color:var(--acc);font-size:13px}
#l3items{flex:1;overflow:auto;padding:4px 18px}
.ci{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.ci .st{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;white-space:nowrap}
.st.pend{background:#FCEBC6;color:#8a5a00}.st.env{background:#D8EBDF;color:var(--acc)}
#l3foot{padding:14px 18px;border-top:2px dashed var(--line);display:flex;flex-direction:column;gap:8px;background:var(--panel2)}
.kanban{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:18px;overflow:auto}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col h3{padding:6px 4px 12px;font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.col .list{display:flex;flex-direction:column;gap:14px;overflow:auto;padding-bottom:10px}
.dc{background:#fff;padding:14px 14px 16px;display:flex;flex-direction:column;gap:7px;font-size:14px;position:relative;border-radius:4px 4px 0 0;
 -webkit-mask:radial-gradient(circle at 6px 100%,transparent 5px,#000 5.5px) 0 0/12px 100% repeat-x;mask:radial-gradient(circle at 6px 100%,transparent 5px,#000 5.5px) 0 0/12px 100% repeat-x;padding-bottom:20px}
.dc .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ch-ifood{background:#ea1d2c;color:#fff;border:0}.ch-whats{background:#25d366;color:#04210f;border:0}.ch-site{background:#3b82f6;color:#fff;border:0}.ch-tel{background:#64748b;color:#fff;border:0}
.timer{font-size:12px;color:var(--mut);font-weight:600}
.timer.late{color:var(--dang);font-weight:800}

/* ===== 4 OFICINA ===== */
#v4 .oslist{width:300px;display:flex;flex-direction:column;background:var(--rail);color:var(--railtxt);flex-shrink:0}
#v4 .oslist .hd{padding:14px;display:flex;gap:8px}
#v4 .oslist input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff}
#l4list{overflow:auto;flex:1;padding:0 10px 10px}
.osc{padding:14px;border-radius:12px;cursor:pointer;margin-bottom:6px;border:2px solid transparent}
.osc:hover{background:rgba(255,255,255,.06)}
.osc.sel{background:rgba(255,255,255,.1);border-color:var(--hl)}
.osc .mut{color:#93A1B5}
.osc .chip{background:rgba(255,255,255,.1);border:0;color:#fff}
.plate{display:inline-block;background:#fff;color:#111;font-weight:800;padding:2px 9px;border-radius:5px;border:2px solid #111;border-top:6px solid #1d4ed8;font-size:14px;letter-spacing:2px;font-stretch:80%}
#l4form{flex:1;overflow:auto;padding:0 26px 26px;min-width:0}
#l4form>div:first-child{margin:0 -26px;padding:18px 26px;background:var(--panel);border-bottom:2px solid var(--line);position:relative}
#l4form>div:first-child::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:8px;background:repeating-linear-gradient(-45deg,var(--hl) 0 12px,var(--rail) 12px 24px)}
#l4form h2{font-size:30px!important;font-weight:800;letter-spacing:-1px;font-stretch:85%}
#l4form>div:first-child .plate{font-size:28px!important;padding:6px 18px!important;border-top-width:10px}
.steps{display:flex;gap:6px;margin:26px 0 22px}
.steps button{flex:1;padding:12px 6px;background:var(--panel);border:2px solid var(--line);font-size:14px;font-weight:700;color:var(--mut);border-radius:10px}
.steps button.done{background:#DCE6FB;border-color:#DCE6FB;color:var(--acc)}
.steps button.cur{background:var(--acc);border-color:var(--acc);color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.fgrid label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:5px;font-weight:700}
.fgrid label input,.fgrid label select{font-size:15px;font-weight:500;color:var(--txt)}
#l4new{white-space:nowrap;background:var(--hl);border-color:var(--hl);color:#111}
.sec{margin-top:24px}
.sec h3{font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.sec h3 select{font-size:14px;font-weight:600;min-width:0}
.sec table{background:var(--panel);border:2px solid var(--line);border-radius:12px;overflow:hidden;border-collapse:separate;border-spacing:0}
.sec td input{padding:6px 9px;border-width:1px}
.x{color:var(--dang);font-weight:800;padding:4px 8px}
#l4side{width:310px;background:var(--panel);border-left:2px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}

/* ===== PEDIDOS (KDS + painel) ===== */
.kds{flex:1.25;overflow:auto;padding:18px;min-width:0}
.kdh{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.kdh h2{font-size:28px;font-weight:800;letter-spacing:-.8px;font-stretch:85%;margin-right:auto}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;align-items:start}
.kc{border-top:6px solid var(--hl)}
.kc.pronto{border-top-color:#16a34a}
.kc .ks{font-size:26px;font-weight:800;font-stretch:80%;letter-spacing:-.5px}
.kits div{padding:4px 0;border-bottom:1px dashed var(--line)}
.kits small{display:block;color:var(--dang);font-weight:700;font-size:12px}
.kdsub{margin:22px 0 12px;font-size:17px;font-weight:800}
.tvp{flex:1;background:#0c1117;color:#eef2f6;display:flex;flex-direction:column;padding:22px;gap:16px;min-width:0;overflow:auto}
.tvh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid #263241;padding-bottom:12px;flex-wrap:wrap}
.tvh b{font-size:22px;font-weight:800;font-stretch:85%}
.tvh span{color:#8b98a8;font-size:13px}
.tvcols{flex:1;display:grid;grid-template-columns:1fr 1.3fr;gap:16px;min-height:0}
.tvc{border:1px solid #263241;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tvc h3{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#8b98a8;font-weight:800}
.tvc.ready{border-color:#1f5f43;background:#0f1d17}
.tvc.ready h3{color:#6fdba6}

function showReceipt(v){
  const W=40,line='-'.repeat(W),pad=(a,b)=>a+' '.repeat(Math.max(1,W-a.length-b.length))+b,ctr=s=>' '.repeat(Math.max(0,Math.floor((W-s.length)/2)))+s;
  const pf=P(),nn=v.nNota?String(v.nNota).padStart(6,'0').replace(/(\d{3})(\d{3})/,'$1.$2'):'';
  let t=`${ctr(pf.razao)}\n${ctr('CNPJ '+pf.cnpj)}\n${ctr(pf.end)}\n${line}\n`;
  if(v.final){
    if(v.fiscal){t+=v.os?`NF-e nº ${nn} · SÉRIE 1 (PEÇAS)\nNFS-e nº ${++S.nfse} (SERVIÇOS)\n`:`DOCUMENTO AUXILIAR DA NOTA FISCAL\nDE CONSUMIDOR ELETRÔNICA\nNFC-e nº ${nn} · SÉRIE ${v.cont?'901':'1'}\n`;
      if(v.cont)t+=`*** EMITIDA EM CONTINGÊNCIA ***\nPendente de autorização da SEFAZ\nSerá transmitida quando a rede voltar\n`}
    else t+=`CUPOM NÃO FISCAL · VENDA ${nn}\n*** NÃO É DOCUMENTO FISCAL ***\n`;
  } else t+=(v.titulo||'DOCUMENTO')+'\n';
  t+=`${new Date().toLocaleString('pt-BR')} · CAIXA 1\nOPERADORA: ${CX.op.toUpperCase()}\n`;
  if(v.cab)t+=v.cab+'\n';t+=line+'\n';
  v.itens.forEach((it,i)=>{t+=`${String(i+1).padStart(3,'0')} ${it.nome.slice(0,34)}\n`;if(it.obs)t+=`    ${it.obs.slice(0,35)}\n`;t+=pad(`    ${(+it.qtd).toLocaleString('pt-BR',{maximumFractionDigits:3})} x ${brl(it.preco)}`,brl(it.qtd*it.preco))+'\n'});
  t+=line+'\n'+pad('SUBTOTAL',brl(v.sub))+'\n';
  if(v.desc)t+=pad('DESCONTO','-'+brl(v.desc))+'\n';
  if(v.acr)t+=pad(v.acrLabel||'ACRÉSCIMO',brl(v.acr))+'\n';
  t+=pad('TOTAL',brl(v.total))+'\n';
  (v.parts||[]).forEach(p=>t+=pad('  '+mN(p.m)[2].toUpperCase()+(p.rot?` (${p.rot.toUpperCase()})`:''),brl(p.v))+'\n');
  if(v.troco)t+=pad('TROCO',brl(v.troco))+'\n';
  if(v.final)t+=line+'\n'+(v.cpf?`CONSUMIDOR: ${v.cpf}\n`:'CONSUMIDOR NÃO IDENTIFICADO\n');
  if(v.rod)t+=line+'\n'+v.rod+'\n';
  if(v.final&&v.fiscal){const ch=Array.from({length:11},()=>Math.floor(1000+Math.random()*8999)).join(' ');
    t+=`\nChave de acesso:\n${ch}\n${v.cont?'Consulte pela chave após a transmissão':'Protocolo 135 26 '+Math.floor(1e7+Math.random()*9e7)+' · AUTORIZADA'}\n[ QR Code de consulta ]\n`}
  t+=`\n${ctr('Obrigado pela preferência!')}`;
  const st=!v.final?'':v.cont?'💾 NFC-e em contingência · venda guardada no caixa, envio quando a rede voltar':!S.online?'💾 Venda guardada no caixa · envio quando a rede voltar':v.fiscal?'📡 Nota autorizada e venda enviada ao servidor':'📡 Venda enviada ao servidor · cupom não fiscal';
  modal(`<h2>${v.final?'✅ Venda concluída':'📄 Documento'} <button onclick="closeModal()" aria-label="Fechar">✕</button></h2><div class="receipt">${esc(t)}</div>
  ${st?`<div class="chip rcst ${S.online?'okc':'warnc'}">${st}</div>`:''}
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="try{navigator.clipboard.writeText(document.querySelector('.receipt').innerText).then(()=>toast('Cupom copiado'),()=>toast('Não foi possível copiar'))}catch(e){toast('Não foi possível copiar')}">📋 Copiar cupom</button><button class="btn pri" style="flex:1" onclick="closeModal()" autofocus>${v.final?'Nova venda':'Fechar'}</button></div>`);
}

async function l1Key(k){
  if(k==='F2'){l1in.focus();l1in.select()}
  if(k==='F3'){const v=await ask('Quantidade do próximo item','2');l1.qtd=num(v)||null;l1Render();l1Foco()}
  if(k==='F4'){if(!l1.itens.length)return toast('Nenhum item na venda');const v=await ask('Desconto na venda','10%',`Valor em R$ ou percentual (ex: 5,00 ou 10%). Acima de ${CFG.descMax}% pede o PIN do supervisor.`);if(v==null)return l1Foco();
    const s=l1sub();let d=String(v).includes('%')?+(s*num(v)/100).toFixed(2):num(v);d=Math.min(d,s);const pct=s?d/s*100:0;
    if(pct>CFG.descMax+1e-9){const ok=await askSup(`Desconto de ${pct.toLocaleString('pt-BR',{maximumFractionDigits:1})}% (${brl(d)}) acima do limite da loja (${CFG.descMax}%)`);if(!ok){toast('Desconto não autorizado');return l1Foco()}}
    l1.desc=d;l1Render();toast('Desconto aplicado: '+brl(d));l1Foco()}
  if(k==='F6'){if(!l1.itens.length)return;const i=l1.sel>=0?l1.sel:l1.itens.length-1;const it=l1.itens[i];
    const ok=await askSup(`Cancelar o item ${String(i+1).padStart(3,'0')}: ${it.nome} (${brl(it.qtd*it.preco)})`);if(!ok)return l1Foco();
    l1.itens.splice(i,1);toast('Item cancelado: '+it.nome);l1.sel=l1.itens.length-1;l1.desc=Math.min(l1.desc,l1sub());l1Render();l1Foco()}
  if(k==='F7'){if(!has('balanca'))return;let v=l1in.value.trim().replace(/^\d+(?:[.,]\d+)?\*/,'');const kg=MERC.filter(x=>x.un==='KG');
    const p=v&&kg.find(x=>x.cod===v||x.nome.toLowerCase().includes(v.toLowerCase()));if(p){l1in.value='';hideSug();return pesar(p)}
    modal(`<h2>⚖️ Ler balança<button onclick="closeModal()" aria-label="Fechar">✕</button></h2><p class="mut" style="margin-bottom:12px">Qual produto está na balança?</p><div class="kgpick">${kg.map(x=>`<button class="btn" onclick="pesar(MERC.find(y=>y.cod==='${x.cod}'))">${esc(x.nome)}<small>${brl(x.preco)}/kg</small></button>`).join('')}</div>`)}
  if(k==='F8'){const v=await ask('CPF/CNPJ na nota',l1.cpf);if(v!=null)l1.cpf=v;l1Render();l1Foco()}
  if(k==='Escape'){if(l1.qtd){l1.qtd=null;l1Render();return}if(l1.itens.length){modal(`<h2>Cancelar a venda inteira?<button onclick="closeModal()">✕</button></h2><p class="mut">${l1.itens.length} item(ns) serão removidos.</p><div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end"><button class="btn" onclick="closeModal()" autofocus>Voltar</button><button class="btn dang" onclick="Object.assign(l1,{itens:[],desc:0,cpf:''});l1Render();closeModal()">Cancelar venda</button></div>`)}}
  if(k==='F10'){if(!l1.itens.length)return toast('Nenhum item na venda');const sub=l1sub();
    openPayment({itens:l1.itens.map(i=>({nome:i.nome,qtd:i.qtd,preco:i.preco})),sub,desc:l1.desc,total:r2(sub-l1.desc),cpf:l1.cpf},()=>{Object.assign(l1,{itens:[],desc:0,cpf:'',sel:-1});l1Render()})}
}
document.addEventListener('keydown',e=>{
  if(modalOpen()){if(e.key==='Escape')closeModal();return}
  if($('#drawer').classList.contains('on')){if(e.key==='Escape')closeDrawer();return}
  if(layout===1&&['F2','F3','F4','F6','F7','F8','F10','Escape'].includes(e.key)){e.preventDefault();l1Key(e.key)}

function l2Open(id){
  const p=MENU2.find(x=>x.id===id);
  if(!p.t){l2Add({e:p.e,nome:p.n,preco:p.p,obs:''});return}
  const radio=(name,arr)=>`<div class="opt">${arr.map((o,i)=>`<label><input type="radio" name="${name}" value="${i}" ${i===0?'checked':''}>${o[0]??o}${o[1]?` +${brl(o[1])}`:''}</label>`).join('')}</div>`;
  const check=(name,arr)=>`<div class="opt">${arr.map((o,i)=>`<label><input type="checkbox" name="${name}" value="${i}">${Array.isArray(o)?`${o[0]} +${brl(o[1])}`:'Sem '+o}</label>`).join('')}</div>`;
  let body='';
  if(p.t==='tam')body=`<b>Tamanho</b>${radio('tam',OPT.tam)}`;
  if(p.t==='combo')body=`<b>Tamanho do combo</b>${radio('tam',OPT.combo)}<b>Bebida</b>${radio('beb',OPT.bebidas)}<b>Turbinar o lanche</b>${check('ext',OPT.extras)}<b>Remover</b>${check('rem',OPT.remover)}`;
  if(p.t==='lanche')body=`<b>Adicionais</b>${check('ext',OPT.extras)}<b>Remover</b>${check('rem',OPT.remover)}`;
  modal(`<h2><span>${p.e} ${esc(p.n)}</span><button onclick="closeModal()" aria-label="Fechar">✕</button></h2><p class="mut" style="margin:-8px 0 14px">${esc(p.d)}</p><form id="optf">${body}
  <b>Observação</b><input name="obs" placeholder="Ex: bem passado, sem sal…" style="margin:6px 0 16px"><button class="bigbtn" style="width:100%"><span>Adicionar ao pedido</span><span id="optp">${brl(p.p)}</span></button></form>`);
  const f=$('#optf');
  const calc=()=>{const fd=new FormData(f);let v=p.p,o=[];
    if(fd.get('tam')!=null){const t=(p.t==='combo'?OPT.combo:OPT.tam)[+fd.get('tam')];v+=t[1];o.push(t[0])}
    if(fd.get('beb')!=null)o.push(OPT.bebidas[+fd.get('beb')]);
    fd.getAll('ext').forEach(i=>{v+=OPT.extras[+i][1];o.push('+'+OPT.extras[+i][0])});
    fd.getAll('rem').forEach(i=>o.push('s/ '+OPT.remover[+i]));
    if(fd.get('obs'))o.push('"'+fd.get('obs')+'"');return{v:r2(v),o:o.join(', ')}};
  f.onchange=()=>$('#optp').textContent=brl(calc().v);
  f.onsubmit=e=>{e.preventDefault();const r=calc();l2Add({e:p.e,nome:p.n,preco:r.v,obs:r.o});closeModal()};
}

   cab:`>>> SENHA ${s} · ${TIPOS[tipo][1]}${nome?' · '+nome.toUpperCase():''}`,rod:has('painel')?'Acompanhe sua senha no painel':'Retire no balcão quando chamar'},

 lanchonete:{forn:'Bebidas Vale Distribuidora',nf:'90.415',refs:()=>[12,13,14,10].map(i=>MENU_L.find(x=>x.id===i))},

const sugP=(c,m)=>{const r=c/(1-m/100);let s=Math.ceil(r*10)/10-0.01;if(s<r-1e-9)s+=0.1;return r2(s)};
function notaDe(k){if(!NOTAS[k]){const d=DEFN[k];NOTAS[k]={...d,ok:false,it:d.refs().map(o=>{const pr=getP(o);return{o,qtd:o.un==='KG'?25:k==='oficina'?10:24,custoAnt:r2(pr*.57),custo:r2(pr*.62),mg:40}})}}return NOTAS[k]}

function retConfirma(){const n=notaDe(S.perfil);n.it.forEach(x=>setP(x.o,sugP(x.custo,x.mg)));n.ok=true;
  toast(`✔ Entrada confirmada: ${n.it.length} preços atualizados no caixa e nos cartões`);renderRet();l1Render();renderFav();if(l2)l2Cats();if(l3)l3Render()}
function renderRet(){const k=S.perfil,n=notaDe(k);const tot=n.it.reduce((a,x)=>a+x.custo*x.qtd,0);
  const extra=['Cadastro de produtos','Tabelas de preço','Promoções','Etiquetas de gôndola','Inventário','Perdas e quebras','Acompanhar os caixas','Conferir fechamentos'].concat(has('balanca')?['Carga da balança','Validade e lote']:[]).concat(has('producao')?['Ficha técnica e custo']:[]).concat(has('os')?['Tabela de mão de obra']:[]);
  $('#vret').innerHTML=`<div class="card pghd"><div><span class="mut">Retaguarda (CPD) · Nota de entrada</span><h2>NF-e ${n.nf} · ${esc(n.forn)}</h2><span class="mut small">Emitida em 14/11/2026 · XML importado da SEFAZ · ${n.it.length} itens · ${brl(tot)}</span></div><span class="chip ${n.ok?'okc':'warnc'}" id="retst">${n.ok?'✓ Preços atualizados':'Aguardando precificação'}</span></div>
  <div class="card"><div class="tw"><table class="rt"><thead><tr><th>Produto</th><th class="r">Qtd</th><th class="r">Custo anterior</th><th class="r">Custo novo</th><th class="r">Margem %</th><th class="r">Preço atual</th><th class="r">Preço sugerido</th></tr></thead><tbody>
  ${n.it.map((x,i)=>`<tr><td><b>${esc(nomeDe(x.o))}</b></td><td class="r mono">${x.qtd} ${x.o.un==='KG'?'kg':'un'}</td><td class="r mono mut">${brl(x.custoAnt)}</td><td class="r mono">${brl(x.custo)}<span class="up">▲ ${((x.custo/x.custoAnt-1)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}%</span></td>
   <td class="r"><input class="mono" id="mg${i}" value="${x.mg}" inputmode="decimal" oninput="retMg(${i},this.value)" aria-label="Margem de ${esc(nomeDe(x.o))}"></td><td class="r mono" id="pa${i}">${brl(getP(x.o))}</td><td class="r mono"><b id="sg${i}">${brl(sugP(x.custo,x.mg))}</b></td></tr>`).join('')}</tbody></table></div>
  <div class="pgft"><p class="mut small">Margem sobre o preço de venda: preço = custo ÷ (1 − margem), arredondado para ,X9. Ao confirmar, o estoque entra, o custo atualiza e o preço novo vai para os caixas, para os cartões do balcão e para as etiquetas.</p><button class="btn pri" id="retok" onclick="retConfirma()">✔ Confirmar entrada e atualizar preços</button></div></div>
  <div class="card" style="padding:16px 18px"><b style="display:block;margin-bottom:10px">Também na retaguarda</b><div class="chips">${extra.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>`;
}

/* =====================================================================
   CAIXA: sangria, suprimento e fechamento com conferência cega
===================================================================== */
function esperado(){const e={din:CX.fundo,pix:0,cre:0,deb:0,vr:0};CX.vendas.forEach(v=>{v.parts.forEach(p=>e[p.m]=r2(e[p.m]+p.v));e.din=r2(e.din-(v.troco||0))});
  CX.mov.forEach(m=>{if(m.t==='Sangria')e.din=r2(e.din-m.v);if(m.t==='Suprimento')e.din=r2(e.din+m.v)});return e}
async function cxSangria(){const v=r2(num(await ask('➖ Sangria','100,00','Valor retirado da gaveta e levado ao cofre.')));if(!v)return;
  if(!await askSup(`Sangria de ${brl(v)} do Caixa 1`))return;CX.mov.push({t:'Sangria',v,h:hora()});toast('➖ Sangria de '+brl(v)+' registrada');renderCx()}
async function cxSupr(){const v=r2(num(await ask('➕ Suprimento','50,00','Dinheiro colocado na gaveta para troco.')));if(!v)return;CX.mov.push({t:'Suprimento',v,h:hora()});toast('➕ Suprimento de '+brl(v)+' registrado');renderCx()}
function cxFechar(){const inf={};METODOS.forEach(m=>inf[m[0]]=r2(num($('#fc_'+m[0]).value)));CX.fech={inf,esp:esperado(),h:hora()};CX.aberto=false;toast('🔒 Caixa 1 fechado');renderCx();renderStatus()}
const difTxt=d=>Math.abs(d)<0.005?'✓ confere':(d<0?'− ':'+ ')+brl(Math.abs(d))+(d<0?' (falta)':' (sobra)');
function renderCx(){
  const movs=CX.mov.map(m=>`<div class="row"><span>${m.h} · ${m.t}</span><span class="mono">${m.t==='Sangria'?'− ':''}${brl(m.v)}</span></div>`).join('');
  const left=`<div class="card cxc"><div class="cxh"><div><span class="mut">Caixa 1 · ${esc(P().loja)}</span><h3>${CX.aberto?'Caixa aberto':'Caixa fechado'}</h3></div><span class="chip ${CX.aberto?'okc':'warnc'}">${CX.aberto?'● Aberto às '+CX.abertoEm:'🔒 Fechado'+(CX.fech?' às '+CX.fech.h:'')}</span></div>
   <div class="row"><span class="mut">Operadora</span><b>${esc(CX.op)}</b></div><div class="row"><span class="mut">Fundo de troco</span><b class="mono">${brl(CX.fundo)}</b></div>
   <div class="row"><span class="mut">Vendas neste caixa</span><b class="mono">${CX.vendas.length}</b></div><div class="row"><span class="mut">Aguardando envio (sem internet)</span><b class="mono">${S.pend}</b></div>
   <div class="movs"><b style="margin-bottom:4px">Movimentos</b>${movs}</div>
   <div class="cxbtns"><button class="btn" id="cxsang" ${CX.aberto?'':'disabled'} onclick="cxSangria()">➖ Sangria</button><button class="btn" ${CX.aberto?'':'disabled'} onclick="cxSupr()">➕ Suprimento</button></div>
   <p class="mut small">🔒 Os totais por forma de pagamento ficam ocultos para o operador até a conferência do fechamento. Sangria pede o PIN do supervisor.</p></div>`;
  let right;
  if(CX.aberto)right=`<div class="card cxc"><h3>Fechamento com conferência cega</h3><p class="mut">Conte a gaveta e os comprovantes e digite o valor de cada forma. O sistema só mostra o esperado e a diferença depois que você confirmar.</p>
   <form id="cxf" class="cnt5" onsubmit="event.preventDefault()">${METODOS.map(m=>`<label>${m[1]} ${m[2]}<input id="fc_${m[0]}" class="mono" inputmode="decimal" placeholder="0,00"></label>`).join('')}</form>
   <button class="btn pri" id="cxfechar" style="padding:14px" onclick="cxFechar()">🔒 Conferir e fechar o caixa</button></div>`;
  else if(CX.fech){const f=CX.fech;let ti=0,te=0;
   const rows=METODOS.map(m=>{const i=f.inf[m[0]],s=f.esp[m[0]],d=r2(i-s);ti+=i;te+=s;return `<tr><td>${m[1]} ${m[2]}</td><td class="r mono">${brl(i)}</td><td class="r mono">${brl(s)}</td><td class="r mono"><span class="dif ${Math.abs(d)<0.005?'ok':'bad'}">${difTxt(d)}</span></td></tr>`}).join('');
   const dt=r2(ti-te),ok=Math.abs(dt)<0.005;
   right=`<div class="card cxc" id="cxres"><h3>Resultado da conferência</h3><div class="tw"><table><thead><tr><th>Forma</th><th class="r">Informado</th><th class="r">Esperado</th><th class="r">Diferença</th></tr></thead><tbody>${rows}<tr><td><b>Total</b></td><td class="r mono"><b>${brl(ti)}</b></td><td class="r mono"><b>${brl(te)}</b></td><td class="r mono"><b class="dif ${ok?'ok':'bad'}">${difTxt(dt)}</b></td></tr></tbody></table></div>
   <div class="cxres ${ok?'ok':'bad'}">${ok?'✓ Caixa confere':(dt<0?'Falta de ':'Sobra de ')+brl(Math.abs(dt))}</div><p class="mut small">O dinheiro vai para o cofre e as vendas em cartão viram recebíveis com a taxa e o prazo de cada bandeira. Diferenças ficam registradas para o supervisor.</p><button class="btn pri" onclick="abrirCaixa()">🔓 Abrir novo caixa</button></div>`}
  else right=`<div class="card cxc"><h3>Caixa fechado</h3><button class="btn pri" onclick="abrirCaixa()">🔓 Abrir caixa</button></div>`;
  $('#vcx').innerHTML=`<div class="card pghd"><div><span class="mut">Caixa 1 · turno de hoje</span><h2>Abertura, sangria e fechamento</h2></div><span class="chip">${esc(fiscalTxt())}</span></div><div class="cxg">${left}${right}</div>`;
}

/* =====================================================================
   BARRA DE STATUS, CONFIGURAÇÃO, PERFIL, ABAS
===================================================================== */
function renderStatus(){const n=$('#sbNet');n.classList.toggle('off',!S.online);
  n.innerHTML=S.online?'<span class="dot"></span>Online':`<span class="dot"></span>Offline · ${S.pend} ${S.pend===1?'venda pendente':'vendas pendentes'}`;
  const c=$('#sbCx');c.classList.toggle('warn',!CX.aberto);c.innerHTML=CX.aberto?`💰 Caixa 1 aberto`:'🔒 Caixa 1 fechado';
  $('#sbOp').textContent='👤 Operadora '+CX.op;
  $('#sbFis').innerHTML=(fiscalAtual()==='nfce'?'🧾 NFC-e':'📄 Cupom não fiscal')+`<span style="opacity:.7">${CFG.exc[S.perfil]?' · exceção da loja':''}</span> ⚙️`;
  $('#sbLoja').textContent='🏪 '+P().loja;
}
function toggleNet(){S.online=!S.online;
  if(S.online){if(S.pend){toast(`📡 ${S.pend} ${S.pend>1?'vendas enviadas e notas transmitidas':'venda enviada e nota transmitida'}`);S.pend=0}else toast('📡 Conexão restabelecida')}
  else toast('📴 Sem internet: o caixa continua vendendo');renderStatus();if(layout==='cx')renderCx()}
function openConfig(){settleAsk();const ex=CFG.exc[S.perfil]||'';
  modal(`<h2>⚙️ Configuração do caixa<button onclick="closeModal()" aria-label="Fechar">✕</button></h2><div class="cfg">
  <section><b>Documento da venda · padrão da empresa</b><div class="seg"><button class="${CFG.emp==='nfce'?'on':''}" onclick="CFG.emp='nfce';cfgUp()">🧾 NFC-e</button><button class="${CFG.emp==='nf'?'on':''}" onclick="CFG.emp='nf';cfgUp()">📄 Cupom não fiscal</button></div><small class="mut">Vale para todas as lojas, salvo exceção.</small></section>
  <section><b>Exceção desta loja · ${esc(P().loja)}</b><select id="cfgex" onchange="CFG.exc[S.perfil]=this.value;cfgUp()"><option value="" ${!ex?'selected':''}>Usar o padrão da empresa</option><option value="nfce" ${ex==='nfce'?'selected':''}>Sempre NFC-e</option><option value="nf" ${ex==='nf'?'selected':''}>Sempre cupom não fiscal</option></select><small class="mut">Vale só para os caixas desta loja. O operador ainda pode trocar na hora do pagamento.</small></section>
  <section><b>Desconto máximo sem supervisor</b><div style="display:flex;gap:8px;align-items:center"><input id="cfgd" class="mono" value="${CFG.descMax}" style="width:90px" onchange="CFG.descMax=Math.max(0,num(this.value));cfgUp()"><span>% da venda</span></div><small class="mut">Acima disso, e para cancelar item ou fazer sangria, o caixa pede o PIN do supervisor.</small></section>
  <div class="paybox" style="margin:0"><div class="row"><span>Em vigor neste caixa</span><b>${fiscalTxt()}</b></div></div>
  <button class="btn pri" onclick="closeModal()">Pronto</button></div>`)}
function cfgUp(){renderStatus();openConfig();if(layout==='cx')renderCx()}
function openDrawer(){renderDrawer();$('#drawer').classList.add('on');$('#dback').classList.add('on');setTimeout(()=>$('#drawer .x2').focus(),30)}
function closeDrawer(){$('#drawer').classList.remove('on');$('#dback').classList.remove('on')}
function renderDrawer(){const p=P();
  $('#drawer').innerHTML=`<div class="dh"><div><span class="mut">Configuração da empresa</span><h2>Perfil do negócio</h2></div><button class="x2" onclick="closeDrawer()" aria-label="Fechar">✕</button></div>
  <div class="dbody"><div class="pfs">${Object.entries(PERFIS).map(([k,v])=>`<a class="pf ${k===S.perfil?'on':''}" href="#${k}" data-perfil="${k}" onclick="closeDrawer()"><span class="pe">${v.ic}</span><b>${v.nome}</b><small>${v.sub}</small></a>`).join('')}</div>
  <h3>Modos de venda (abas)</h3><div class="chips">${p.modos.map(m=>`<span class="chip">${TABN(m)}</span>`).join('')}${has('cozinha')?'<span class="chip">👨‍🍳 Pedidos</span>':''}</div>
  <h3>Módulos ligados</h3><div class="mods">${MODULOS.filter(m=>has(m[0])).map(m=>`<span class="mod on">✓ ${m[1]}</span>`).join('')}</div>
  <h3>Módulos ocultos</h3><div class="mods">${MODULOS.filter(m=>!has(m[0])).map(m=>`<span class="mod off">${m[1]}</span>`).join('')||'<span class="mut">Nenhum</span>'}</div>
  <p class="mut small">Oculto não aparece para o operador: sem cadeado, sem menu cinza. Liga quando o negócio precisar.</p>
  <h3>O que muda neste tipo</h3><ul>${p.dif.map(d=>`<li>${d}</li>`).join('')}</ul></div>`}
function tabsDe(){const p=P();const t=p.modos.map(m=>[m,TABN(m)]);const n=ORD.filter(o=>o.perfil===S.perfil&&o.st==='coz').length;
  if(has('cozinha'))t.push(['ped',`👨‍🍳 Pedidos${n?`<span class="cnt">${n}</span>`:''}`]);t.push(['ret','📦 Retaguarda'],['cx','💰 Caixa']);return t}
function renderTabs(){$('#tabs').innerHTML=tabsDe().map(([k,n])=>`<button role="tab" data-l="${k}" class="${String(k)===String(layout)?'on':''}" aria-selected="${String(k)===String(layout)}" onclick="goTab('${k}')">${n}</button>`).join('')}
function goTab(k){k=/^\d$/.test(String(k))?+k:k;if(!tabsDe().some(t=>String(t[0])===String(k)))return;setLayout(k)}
const VIEW={1:'v1',2:'v2',3:'v3',4:'v4',ped:'vped',ret:'vret',cx:'vcx'};
function setLayout(k){layout=k;if(l3)l3.sheet=false;$("#l2order").classList.remove("open");const pal=typeof k==='number'?k:P().modos[0];
  document.body.classList.remove('l1','l2','l3','l4');document.body.classList.add('l'+pal);
  $$('.view').forEach(v=>v.classList.toggle('on',v.id===VIEW[k]));renderTabs();
  if(k===1){l1Render();if(!isMob())l1in.focus()}if(k===2)l2Render();if(k===3)l3Render();if(k===4)l4Render();
  if(k==='ped')renderPed();if(k==='ret')renderRet();if(k==='cx')renderCx();
  const b=$('#tabs button.on');if(b)try{b.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}
}
function setPerfil(k){if(!PERFIS[k])k='supermercado';S.perfil=k;const p=P();closeDrawer();if(modalOpen())closeModal();
  MERC=CAT1[k]||CAT1.supermercado;FAV=FAVS[k]||FAVS.supermercado;Object.assign(l1,{itens:[],desc:0,cpf:'',qtd:null,sel:-1});hideSug();l1in.value='';
  renderFav();renderKeys();l1Render();
  const b=BAL[k]||BAL.lanchonete;CATS2=b.cats;MENU2=b.menu;l2=L2[k]||(L2[k]={cat:CATS2[0][0],itens:[],tipo:0,senha:b.senha});$('#l2order').classList.remove('open');l2Cats();
  if(p.modos.includes(3)){l3=L3[k]||(L3[k]=mkL3(k))}
  seedPed(k);
  $('#pfNome').textContent=p.nome;$('#pfIco').textContent=p.ic;
  renderStatus();setLayout(p.modos[0]);
}
addEventListener('hashchange',()=>setPerfil(decodeURIComponent(location.hash.slice(1))));
l4Render();tick();
setPerfil(decodeURIComponent(location.hash.slice(1))||'supermercado');
</script>

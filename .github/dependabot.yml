version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # FluentAssertions 8+ tem licença comercial (ADR 0009): fica na 7.x.
      - dependency-name: FluentAssertions
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /src/Web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

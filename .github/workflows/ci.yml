name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Cadeia de suprimentos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Actions fixadas por SHA
        run: sh scripts/check-actions-pinned.sh

  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore BemAquiEmpresas.slnx
      - name: Build
        run: dotnet build BemAquiEmpresas.slnx --no-restore -c Release
      - name: Testes (unidade, arquitetura, integração com Testcontainers)
        run: dotnet test --solution BemAquiEmpresas.slnx --no-build -c Release
      - name: Pacotes vulneráveis (alta/crítica falham)
        run: |
          dotnet list BemAquiEmpresas.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE '\b(High|Critical)\b' vuln.txt; then echo "Pacote com vulnerabilidade alta ou crítica."; exit 1; fi

  frontend:
    name: Frontend (Web)
    runs-on: ubuntu-latest
    needs: supply-chain
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/Web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/Web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Auditoria de dependências (alta/crítica falham)
        run: pnpm audit --audit-level high

name: CI

# Roda no PR pronto para revisão, que é o mesmo código que
# entra na main pelo squash, e não repete no push da main. PR que só muda docs/ não roda; rascunho espera ficar pronto.
# No PR: unidade, integração, arquitetura, Vitest, lint e build, sem E2E nem teste de carga (decisão do PO em 31/10/2026).
# E2E e carga ficam na rodada completa: à mão no fechamento de cada feature (workflow_dispatch) e toda noite na main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
  # Fechamento de feature (marco do backlog) e conferência da main: rodada completa, com E2E e testes de carga, à mão.
  workflow_dispatch:
  # Toda noite na main (03:00 em Brasília): a rodada completa pega em até um dia a regressão de tela que o PR não roda.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Cadeia de suprimentos
    # Rascunho não gasta minutos; os outros jobs dependem deste e são pulados junto.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Actions fixadas por SHA
        run: sh scripts/check-actions-pinned.sh

  backend:
    name: Backend (.NET) — ${{ matrix.chunk.name }}
    runs-on: ubuntu-latest
    needs: supply-chain
    # A suíte inteira num processo só acumula memória do test host. Em blocos por namespace (como o suite-chunks local)
    # roda em paralelo e cada máquina fica leve. O bloco "resto" pega tudo que os outros excluem, inclusive unidade e
    # arquitetura. Assembly sem teste no filtro sai com código 8, que aqui não é falha.
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - name: financeiro
            filter: --filter-namespace "BemAqui.Integration.Tests.Finance*"
          - name: comercial
            filter: >-
              --filter-namespace "BemAqui.Integration.Tests.Commercial*"
              --filter-namespace "BemAqui.Integration.Tests.Dashboard*"
              --filter-namespace "BemAqui.Integration.Tests.Agenda*"
          # Os testes das OS de fabricação (171, cada classe em série sobre o próprio banco) eram quase todo o tempo do bloco:
          # ficam em quatro classes, cada uma num job próprio (FabricationTests.*.cs, base FabricationTestBase).
          - name: producao-os-1
            filter: --filter-class "BemAqui.Integration.Tests.Production.FabricationOrdersTests"
          - name: producao-os-2
            filter: --filter-class "BemAqui.Integration.Tests.Production.FabricationShopfloorTests"
          - name: producao-os-3
            filter: --filter-class "BemAqui.Integration.Tests.Production.FabricationDeliveryTests"
          - name: producao-os-4
            filter: --filter-class "BemAqui.Integration.Tests.Production.FabricationBoardTests"
          - name: producao
            filter: >-
              --filter-namespace "BemAqui.Integration.Tests.Production*"
              --filter-namespace "BemAqui.Integration.Tests.Engineering*"
              --filter-not-class "BemAqui.Integration.Tests.Production.FabricationOrdersTests"
              --filter-not-class "BemAqui.Integration.Tests.Production.FabricationShopfloorTests"
              --filter-not-class "BemAqui.Integration.Tests.Production.FabricationDeliveryTests"
              --filter-not-class "BemAqui.Integration.Tests.Production.FabricationBoardTests"
          - name: estoque
            filter: >-
              --filter-namespace "BemAqui.Integration.Tests.Inventory*"
              --filter-namespace "BemAqui.Integration.Tests.Purchasing*"
          - name: resto
            vuln: true
            filter: >-
              --filter-not-namespace "BemAqui.Integration.Tests.Finance*"
              --filter-not-namespace "BemAqui.Integration.Tests.Commercial*"
              --filter-not-namespace "BemAqui.Integration.Tests.Dashboard*"
              --filter-not-namespace "BemAqui.Integration.Tests.Agenda*"
              --filter-not-namespace "BemAqui.Integration.Tests.Production*"
              --filter-not-namespace "BemAqui.Integration.Tests.Engineering*"
              --filter-not-namespace "BemAqui.Integration.Tests.Inventory*"
              --filter-not-namespace "BemAqui.Integration.Tests.Purchasing*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore BemAquiEmpresas.slnx
      - name: Build
        run: dotnet build BemAquiEmpresas.slnx --no-restore -c Release
      # Cada WebApplicationFactory abre um watcher do appsettings; o bloco grande estoura o limite padrão do runner
      # (128 instâncias de inotify). Sobe o limite e desliga o reload, que não serve para teste.
      - name: Limite de inotify
        run: sudo sysctl -w fs.inotify.max_user_instances=8192 fs.inotify.max_user_watches=524288
      - name: Testes (unidade, arquitetura, integração com Testcontainers)
        env:
          DOTNET_hostBuilder__reloadConfigOnChange: "false"
        run: dotnet test --solution BemAquiEmpresas.slnx --no-build -c Release --ignore-exit-code 8 ${{ matrix.chunk.filter }} ${{ github.event_name == 'pull_request' && '--filter-not-trait "Categoria=Carga"' || '' }}
      - name: Pacotes vulneráveis (alta/crítica falham)
        if: matrix.chunk.vuln
        run: |
          dotnet list BemAquiEmpresas.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE '\b(High|Critical)\b' vuln.txt; then echo "Pacote com vulnerabilidade alta ou crítica."; exit 1; fi

  frontend:
    name: Frontend (Web)
    runs-on: ubuntu-latest
    needs: supply-chain
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/Web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/Web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cliente da API atualizado (Orval x openapi.json)
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/generated
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: E2E (Playwright, desktop e celular)
        if: github.event_name != 'pull_request'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Auditoria de dependências (alta/crítica falham)
        run: pnpm audit --audit-level high

  infra:
    name: Infra (compose, nginx e imagens)
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose endurecido (FND-10 CA 8 a 10)
        run: |
          docker compose -f deploy/homolog/docker-compose.yml --env-file deploy/homolog/.env.example --profile backup --profile import config --format json > compose.json
          node scripts/check-compose.mjs compose.json
      - name: nginx -t do vhost (FND-10 CA 4)
        run: sh scripts/check-nginx.sh
      - name: Scripts de shell
        run: |
          for f in deploy/homolog/deploy.sh deploy/homolog/backup-cron.sh deploy/backup/backup.sh deploy/postgres/init-roles.sh scripts/smoke.sh scripts/dolibarr-snapshot.sh scripts/dolibarr/restore-snapshot.sh; do sh -n "$f"; done
      - name: Imagens (api, web, backup)
        run: |
          for image in api web backup; do docker build -q -f "deploy/$image.Dockerfile" -t "bqe-ci-$image" .; done

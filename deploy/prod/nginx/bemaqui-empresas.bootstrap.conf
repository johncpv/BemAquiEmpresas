# Só para emitir os certificados novos da produção (certbot webroot) ANTES da virada: plataforma.bemaquiapp.com.br e adm.konebras.com.br.
# O app.konebras.com.br fica de fora: o vhost atual do Dolibarr já responde o ACME dele e o certificado já existe.
# Copie para /opt/infra/nginx/conf.d/bemaqui-empresas.conf; na virada, troque pelo bemaqui-empresas.conf e instale o adm-dolibarr.conf.
# Antes do reload: docker exec stack-nginx nginx -t.
server {
    listen 80;
    server_name plataforma.bemaquiapp.com.br adm.konebras.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}

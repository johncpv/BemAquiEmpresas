# BemAqui Empresas — PRODUÇÃO (GOL-01a CA 3, ADR 0034, 0004, 0005 D1/D2 e 0015). Vai em /opt/infra/nginx/conf.d/bemaqui-empresas.conf
# no stack-nginx, NA VIRADA (GOL-01b): antes dela o app.konebras.com.br é do Dolibarr, e este arquivo junto com o vhost atual do
# Dolibarr daria dois servers para o mesmo host. Até lá, use o bemaqui-empresas.bootstrap.conf (só ACME da plataforma e do adm.).
# Precisa do 00-bemaqui-empresas-common.conf (log_format bqe_masked e maps $bqe_*). Antes de qualquer reload: docker exec stack-nginx nginx -t.
# Certificados do certbot existente (volume stack_certbot-etc), um por host: app.konebras.com.br (já existe, é o do Dolibarr hoje) e
# plataforma.bemaquiapp.com.br (emitido pelo bootstrap).
#
# Allowlist: o host do tenant é PÚBLICO (os usuários da Konebras entram de qualquer rede; a homologação também não tem allowlist no host do
# tenant). A allowlist de IP vale só para o painel da plataforma (super admin e Hangfire, ADR 0005 D2 e ADR 0010 item 7), como na
# homologação, e nunca para /webhooks/ (o Inter e o EmissorFiscal chamam de IPs que não controlamos; a origem é provada pela assinatura
# ou pelo token, ADR 0031).
# Cabeçalhos de segurança: como na homologação, vêm dos upstreams (SecurityHeadersMiddleware da API e deploy/web/nginx.conf, com CSP,
# HSTS, nosniff, X-Frame-Options, Referrer-Policy, Permissions-Policy e COOP); aqui só server_tokens off. Repetir aqui duplicaria os
# cabeçalhos na resposta.

# Painel da plataforma de produção só para IPs liberados; fora deles, 404. Lista em bemaqui-empresas.allow ("<ip ou cidr> 1;" por linha).
geo $bqe_prod_platform_allowed {
    default 0;
    include /etc/nginx/conf.d/bemaqui-empresas.allow;
}

server {
    listen 80;
    server_name app.konebras.com.br plataforma.bemaquiapp.com.br;
    access_log /var/log/nginx/access.log bqe_masked;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Tenant konebras: público.
server {
    listen 443 ssl;
    http2 on;
    server_name app.konebras.com.br;
    access_log /var/log/nginx/access.log bqe_masked;
    client_max_body_size 32M;
    ssl_certificate     /etc/letsencrypt/live/app.konebras.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.konebras.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    resolver 127.0.0.11 valid=30s;
    set $bqe_api http://bqe-prod-api:8080;
    set $bqe_web http://bqe-prod-web:8080;

    location ~ ^/(api|health)(/|$) {
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SignalR: WebSocket e conexão longa (o keep-alive do SignalR é de 15 s; 300 s cobre a reconexão).
    location /hubs/ {
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bqe_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # O tenantKey só vale no host da plataforma (ADR 0031): aqui a rota não existe, nem chega ao front.
    location /webhooks/ {
        return 404;
    }

    location / {
        proxy_pass $bqe_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Plataforma de produção (super admin, Hangfire, webhooks): mesma API, outro host. Allowlist nas locations do painel; /webhooks/ fora dela.
server {
    listen 443 ssl;
    http2 on;
    server_name plataforma.bemaquiapp.com.br;
    access_log /var/log/nginx/access.log bqe_masked;
    client_max_body_size 8M;
    ssl_certificate     /etc/letsencrypt/live/plataforma.bemaquiapp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plataforma.bemaquiapp.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    resolver 127.0.0.11 valid=30s;
    set $bqe_api http://bqe-prod-api:8080;
    set $bqe_web http://bqe-prod-web:8080;

    # Webhooks (FND-16, ADR 0031; Inter, BNK-02; EmissorFiscal, ADR 0027 adendo de 27/10/2026): fora da allowlist, só GET/POST, corpo
    # pequeno. O log usa $bqe_uri (tenantKey e token mascarados) e o error_log em crit evita a URL num erro de upstream.
    location /webhooks/ {
        limit_except GET POST { deny all; }
        client_max_body_size 64k;
        error_log /var/log/nginx/error.log crit;
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/(api|health|hangfire)(/|$) {
        if ($bqe_prod_platform_allowed = 0) { return 404; }
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        if ($bqe_prod_platform_allowed = 0) { return 404; }
        proxy_pass $bqe_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

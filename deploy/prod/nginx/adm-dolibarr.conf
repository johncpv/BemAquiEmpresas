# Dolibarr em adm.konebras.com.br, SÓ LEITURA, depois da virada (GOL-01a CA 11, ADR 0034 §4, ADR 0004 §5 e 0005 D1). Vai em
# /opt/infra/nginx/conf.d/adm-dolibarr.conf no stack-nginx, na virada, junto com o bemaqui-empresas.conf; o vhost atual do Dolibarr
# (app.konebras.com.br) sai do conf.d e fica guardado FORA dele (ex.: /opt/infra/nginx/rollback/) para o rollback da GOL-01a CA 9.
# Precisa do 00-bemaqui-empresas-common.conf (bqe_masked, que tira do log a query com o token de CSRF do Dolibarr).
# Antes de qualquer reload: docker exec stack-nginx nginx -t.
#
# Acesso: allowlist de IP OU autenticação básica (satisfy any). Quem está num IP da lista entra direto na tela de login do Dolibarr;
# os outros precisam da senha básica antes. Os dois arquivos ficam na VPS, fora do repositório:
#   /etc/nginx/conf.d/adm-dolibarr.allow     linhas "allow <ip ou cidr>;" (modelo: adm-dolibarr.allow.example)
#   /etc/nginx/conf.d/adm-dolibarr.htpasswd  gerado com htpasswd -B (bcrypt), chmod 0640, nunca versionado
# O "só leitura" de verdade é no Dolibarr (perfis sem escrita, usuários da DOLAPIKEY desativados); aqui a API REST e o instalador
# ficam fechados, e o resto exige a allowlist ou a senha.

server {
    listen 80;
    server_name adm.konebras.com.br;
    access_log /var/log/nginx/access.log bqe_masked;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name adm.konebras.com.br;
    access_log /var/log/nginx/access.log bqe_masked;
    client_max_body_size 4M;
    ssl_certificate     /etc/letsencrypt/live/adm.konebras.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adm.konebras.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    resolver 127.0.0.11 valid=30s;
    # CONFIRMAR NA VPS: o mesmo upstream do vhost atual do app.konebras.com.br (nome do container do Dolibarr na stack_stack e porta),
    # por "grep -n 'set \$' /opt/infra/nginx/conf.d/*.conf". O nome abaixo é um marcador e não resolve: sem a troca, a página dá 502.
    set $bqe_dolibarr http://CONFIRMAR-container-do-dolibarr:80;

    add_header X-Robots-Tag "noindex, nofollow" always;

    satisfy any;
    include /etc/nginx/conf.d/adm-dolibarr.allow;
    deny all;
    auth_basic "Dolibarr (somente leitura)";
    auth_basic_user_file /etc/nginx/conf.d/adm-dolibarr.htpasswd;

    # API REST (era da DOLAPIKEY e do Konebras UI) e instalador: fechados para todo mundo.
    location ^~ /api/ { return 404; }
    location ^~ /install/ { return 404; }

    location / {
        proxy_pass $bqe_dolibarr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A senha básica não segue para o Dolibarr.
        proxy_set_header Authorization "";
        proxy_read_timeout 120s;
    }
}

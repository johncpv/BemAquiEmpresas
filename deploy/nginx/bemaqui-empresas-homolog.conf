# BemAqui Empresas — PRODUÇÃO desde 02/11/2026: a stack bemaqui-empresas-homolog virou a produção (decisão do PO de 02/11/2026,
# ADR 0034 adendo de 02/11/2026 e ADR 0020; GOL-01b). É a cópia do arquivo instalado em /opt/infra/nginx/conf.d/ no stack-nginx.
# Hosts: app.konebras.com.br (tenant konebras, certificado do app.), homolog.konebras.com.br (só 301 para o app.) e
# plataforma-homolog.bemaquiapp.com.br (super admin, Hangfire e /webhooks/, sem mudança). O vhost antigo do Dolibarr em app.
# (default.conf) saiu do conf.d e ficou guardado fora dele. Os nomes "homolog" (containers, allowlist) ficam até a fase 2 (ambiente novo).
# Antes de qualquer reload: docker exec stack-nginx nginx -t. Os certificados vêm do certbot existente
# (volume stack_certbot-etc), um por host; enquanto não existirem, use o bemaqui-empresas-homolog.bootstrap.conf.
# Precisa do 00-bemaqui-empresas-common.conf (log_format bqe_masked e os maps $bqe_*), comum com a produção (GOL-01a): as definições
# saíram daqui porque o mesmo nome em dois arquivos derruba o nginx -t. Instale os dois juntos, no mesmo reload.

# Painel da plataforma só para IPs liberados (ADR 0010 item 7); fora deles, 404. Lista em bemaqui-empresas-homolog.allow.
geo $bqe_homolog_platform_allowed {
    default 0;
    include /etc/nginx/conf.d/bemaqui-empresas-homolog.allow;
}

server {
    listen 80;
    server_name app.konebras.com.br homolog.konebras.com.br plataforma-homolog.bemaquiapp.com.br;
    access_log /var/log/nginx/access.log bqe_masked;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Tenant konebras em produção (GOL-01b, virada de 02/11/2026): a homologação virou a produção (decisão do PO de 02/11/2026).
server {
    listen 443 ssl;
    http2 on;
    server_name app.konebras.com.br;
    access_log /var/log/nginx/access.log bqe_masked;
    client_max_body_size 32M;
    ssl_certificate     /etc/letsencrypt/live/app.konebras.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.konebras.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    resolver 127.0.0.11 valid=30s;
    set $bqe_api http://bqe-homolog-api:8080;
    set $bqe_web http://bqe-homolog-web:8080;

    location ~ ^/(api|health)(/|$) {
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SignalR (CA 5): WebSocket e conexão longa.
    location /hubs/ {
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bqe_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass $bqe_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# O host antigo da homologação leva para o novo.
server {
    listen 443 ssl;
    http2 on;
    server_name homolog.konebras.com.br;
    access_log /var/log/nginx/access.log bqe_masked;
    ssl_certificate     /etc/letsencrypt/live/homolog.konebras.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homolog.konebras.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 301 https://app.konebras.com.br$request_uri;
}

# Plataforma (super admin, Hangfire, webhooks) de homologação: mesma API, outro host. A allowlist vale nas locations do painel; a
# /webhooks/ fica fora dela (ADR 0031; docs/operacao/emissor-fiscal.md §2 e banco-inter.md).
server {
    listen 443 ssl;
    http2 on;
    server_name plataforma-homolog.bemaquiapp.com.br;
    access_log /var/log/nginx/access.log bqe_masked;
    client_max_body_size 8M;
    ssl_certificate     /etc/letsencrypt/live/plataforma-homolog.bemaquiapp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plataforma-homolog.bemaquiapp.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    resolver 127.0.0.11 valid=30s;
    set $bqe_api http://bqe-homolog-api:8080;
    set $bqe_web http://bqe-homolog-web:8080;

    # Webhooks (FND-16, ADR 0031; EmissorFiscal, ADR 0027 adendo de 27/10/2026): fora da allowlist, só GET/POST, corpo pequeno. O
    # error_log em crit evita a URL (tenantKey e, no modo PathToken, o token) num erro de upstream.
    location /webhooks/ {
        limit_except GET POST { deny all; }
        client_max_body_size 64k;
        error_log /var/log/nginx/error.log crit;
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/(api|health|hangfire)(/|$) {
        if ($bqe_homolog_platform_allowed = 0) { return 404; }
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        if ($bqe_homolog_platform_allowed = 0) { return 404; }
        proxy_pass $bqe_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

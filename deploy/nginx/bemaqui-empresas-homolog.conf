# BemAqui Empresas — homologação (FND-10, ADR 0004 e 0015). Vai em /opt/infra/nginx/conf.d/ no stack-nginx.
# Antes de qualquer reload: docker exec stack-nginx nginx -t. Os certificados vêm do certbot existente
# (volume stack_certbot-etc), um por host; enquanto não existirem, use o bemaqui-empresas-homolog.bootstrap.conf.

# Log sem segredo (CA 6): a query string (convite, redefinição, access_token do SignalR) e a do Referer nunca entram
# no log; o cabeçalho Authorization também não. Nomes com prefixo bqe_ para não colidir com os outros projetos.
map $http_referer $bqe_referer {
    "~^(?<bqe_ref>[^?#]*)" $bqe_ref;
    default "";
}
# Webhooks (FND-16; BNK-02 CA 2): o que vem depois de /webhooks/{provedor}/ (tenantKey e, no modo PathToken, o token) não entra no log.
map $uri $bqe_uri {
    "~^(?<bqe_wh>/webhooks/[a-z0-9-]+)/" "$bqe_wh/***";
    default $uri;
}
log_format bqe_masked '$remote_addr - [$time_local] "$request_method $bqe_uri $server_protocol" $status $body_bytes_sent '
                      '"$bqe_referer" "$http_user_agent" rt=$request_time';

map $http_upgrade $bqe_connection_upgrade {
    default upgrade;
    "" close;
}

# Painel da plataforma só para IPs liberados (ADR 0010 item 7); fora deles, 404. Lista em bemaqui-empresas-homolog.allow.
geo $bqe_homolog_platform_allowed {
    default 0;
    include /etc/nginx/conf.d/bemaqui-empresas-homolog.allow;
}

server {
    listen 80;
    server_name homolog.konebras.com.br plataforma-homolog.bemaquiapp.com.br;
    access_log /var/log/nginx/access.log bqe_masked;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Tenant de homologação.
server {
    listen 443 ssl;
    http2 on;
    server_name homolog.konebras.com.br;
    access_log /var/log/nginx/access.log bqe_masked;
    client_max_body_size 32M;
    ssl_certificate     /etc/letsencrypt/live/homolog.konebras.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homolog.konebras.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    resolver 127.0.0.11 valid=30s;
    set $bqe_api http://bqe-homolog-api:8080;
    set $bqe_web http://bqe-homolog-web:8080;

    location ~ ^/(api|health)(/|$) {
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SignalR (CA 5): WebSocket e conexão longa.
    location /hubs/ {
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bqe_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass $bqe_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Plataforma (super admin, Hangfire) de homologação: mesma API, outro host, atrás da allowlist.
server {
    listen 443 ssl;
    http2 on;
    server_name plataforma-homolog.bemaquiapp.com.br;
    access_log /var/log/nginx/access.log bqe_masked;
    client_max_body_size 8M;
    ssl_certificate     /etc/letsencrypt/live/plataforma-homolog.bemaquiapp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plataforma-homolog.bemaquiapp.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    resolver 127.0.0.11 valid=30s;
    set $bqe_api http://bqe-homolog-api:8080;
    set $bqe_web http://bqe-homolog-web:8080;

    if ($bqe_homolog_platform_allowed = 0) { return 404; }

    location ~ ^/(api|health|hangfire)(/|$) {
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass $bqe_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

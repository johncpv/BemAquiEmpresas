# Só para emitir os certificados da homologação (certbot webroot). Depois de emitidos, troque pelo
# bemaqui-empresas-homolog.conf. Antes do reload: docker exec stack-nginx nginx -t.
server {
    listen 80;
    server_name homolog.konebras.com.br plataforma-homolog.bemaquiapp.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}

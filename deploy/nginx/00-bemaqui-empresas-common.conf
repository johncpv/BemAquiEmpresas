# BemAqui Empresas: definições comuns aos vhosts da homologação, da produção e do Dolibarr em adm. (GOL-01a CA 3). Vai em
# /opt/infra/nginx/conf.d/00-bemaqui-empresas-common.conf no stack-nginx. Tudo no mesmo contexto http do nginx compartilhado:
#   - um log_format com o mesmo nome definido em dois arquivos derruba o "nginx -t" ("duplicate log_format name");
#   - o access_log só acha o formato se ele vier ANTES; o conf.d é lido em ordem alfabética, por isso o prefixo "00-".
# Antes de qualquer reload: docker exec stack-nginx nginx -t.

# Log sem segredo (FND-10 CA 6): a query string (convite, redefinição, access_token do SignalR, token do webhook no modo Query, token de
# CSRF do Dolibarr) e a do Referer nunca entram no log; o cabeçalho Authorization e o cookie também não. Prefixo bqe_ para não colidir
# com os outros projetos.
map $http_referer $bqe_referer {
    "~^(?<bqe_ref>[^?#]*)" $bqe_ref;
    default "";
}
# Webhooks (FND-16; BNK-02 CA 2): o que vem depois de /webhooks/{provedor}/ (tenantKey e, no modo PathToken, o token) não entra no log.
map $uri $bqe_uri {
    "~^(?<bqe_wh>/webhooks/[a-z0-9-]+)/" "$bqe_wh/***";
    default $uri;
}
log_format bqe_masked '$remote_addr - [$time_local] "$request_method $bqe_uri $server_protocol" $status $body_bytes_sent '
                      '"$bqe_referer" "$http_user_agent" rt=$request_time';

map $http_upgrade $bqe_connection_upgrade {
    default upgrade;
    "" close;
}

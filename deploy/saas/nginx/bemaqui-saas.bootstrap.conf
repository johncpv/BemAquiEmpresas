# Só para emitir os certificados do SaaS (certbot webroot) ANTES do bemaqui-saas.conf. TEMPLATE: troque os placeholders (ADR 0051 §6).
#   sed -e 's/__PLATFORM_HOST__/<host da plataforma>/g' -e 's/__APP_HOST__/<host do ERP>/g' bemaqui-saas.bootstrap.conf > /opt/infra/nginx/conf.d/bemaqui-saas.conf
# Depois de emitidos, troque pelo bemaqui-saas.conf (mesmo nome de destino). Antes do reload: docker exec stack-nginx nginx -t.
server {
    listen 80;
    server_name __PLATFORM_HOST__ __APP_HOST__;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}

# BemAqui Empresas — ambiente SaaS multi-tenant (ADR 0051, que complementa 0004, 0015, 0020 e 0034). TEMPLATE: os domínios ainda não foram
# definidos pelo PO; antes de instalar, troque os dois placeholders (runbook "Ambiente SaaS" em docs/operacao/deploy.md):
#   __PLATFORM_HOST__  painel da plataforma (super admin), Hangfire e /webhooks/
#   __APP_HOST__       ERP do tenant "bemaqui" (o primeiro tenant, a gestão do ecossistema)
#   sed -e 's/__PLATFORM_HOST__/<host da plataforma>/g' -e 's/__APP_HOST__/<host do ERP>/g' bemaqui-saas.conf > /opt/infra/nginx/conf.d/bemaqui-saas.conf
# Cada cliente novo ganha o próprio vhost (bemaqui-saas-tenant.conf.template, __TENANT_HOST__), um registro A DNS-only para 2.25.82.127 e um
# certificado; alternativa futura (não implementada): curinga *.<domínio> com certbot DNS-01 via Cloudflare, ver ADR 0051 §6.
# Os upstreams são bqe-saas-api:8080 e bqe-saas-web:8080 (rede stack_stack), sem relação com bqe-homolog-* da Konebras.
# Precisa do 00-bemaqui-empresas-common.conf (log_format bqe_masked e maps $bqe_*), já instalado pela stack da Konebras: é o mesmo arquivo
# (não duplique os formatos). Antes de qualquer reload: docker exec stack-nginx nginx -t.
# Certificados do certbot existente (volume stack_certbot-etc), um por host, emitidos com o bemaqui-saas.bootstrap.conf.
#
# Allowlist: o host do tenant é PÚBLICO. A allowlist de IP vale só para o painel da plataforma (super admin e Hangfire, ADR 0010 item 7),
# e nunca para /webhooks/ (o Inter e o EmissorFiscal chamam de IPs que não controlamos; a origem é provada pela assinatura ou pelo
# token, ADR 0031).
# Cabeçalhos de segurança (ADR 0015): vêm dos upstreams (SecurityHeadersMiddleware da API e deploy/web/nginx.conf: CSP, HSTS, nosniff,
# X-Frame-Options, Referrer-Policy, Permissions-Policy e COOP); aqui só server_tokens off. Repetir aqui duplicaria os cabeçalhos.

geo $bqe_saas_platform_allowed {
    default 0;
    include /etc/nginx/conf.d/bemaqui-saas.allow;
}

server {
    listen 80;
    server_name __APP_HOST__ __PLATFORM_HOST__;
    access_log /var/log/nginx/access.log bqe_masked;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ERP do tenant bemaqui (a gestão do ecossistema): público.
server {
    listen 443 ssl;
    http2 on;
    server_name __APP_HOST__;
    access_log /var/log/nginx/access.log bqe_masked;
    client_max_body_size 32M;
    ssl_certificate     /etc/letsencrypt/live/__APP_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__APP_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    resolver 127.0.0.11 valid=30s;
    set $bqe_api http://bqe-saas-api:8080;
    set $bqe_web http://bqe-saas-web:8080;

    location ~ ^/(api|health)(/|$) {
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SignalR: WebSocket e conexão longa (o keep-alive do SignalR é de 15 s; 300 s cobre a reconexão).
    location /hubs/ {
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bqe_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # O tenantKey só vale no host da plataforma (ADR 0031): aqui a rota não existe, nem chega ao front.
    location /webhooks/ {
        return 404;
    }

    location / {
        proxy_pass $bqe_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Plataforma do SaaS (super admin, Hangfire, webhooks): mesma API, outro host. Allowlist nas locations do painel; /webhooks/ fora dela.
server {
    listen 443 ssl;
    http2 on;
    server_name __PLATFORM_HOST__;
    access_log /var/log/nginx/access.log bqe_masked;
    client_max_body_size 8M;
    ssl_certificate     /etc/letsencrypt/live/__PLATFORM_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PLATFORM_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    resolver 127.0.0.11 valid=30s;
    set $bqe_api http://bqe-saas-api:8080;
    set $bqe_web http://bqe-saas-web:8080;

    # Webhooks (FND-16, ADR 0031; Inter, BNK-02; EmissorFiscal, ADR 0027 adendo de 27/10/2026): fora da allowlist, só GET/POST, corpo
    # pequeno. O log usa $bqe_uri (tenantKey e token mascarados) e o error_log em crit evita a URL num erro de upstream.
    location /webhooks/ {
        limit_except GET POST { deny all; }
        client_max_body_size 64k;
        error_log /var/log/nginx/error.log crit;
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/(api|health|hangfire)(/|$) {
        if ($bqe_saas_platform_allowed = 0) { return 404; }
        proxy_pass $bqe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        if ($bqe_saas_platform_allowed = 0) { return 404; }
        proxy_pass $bqe_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

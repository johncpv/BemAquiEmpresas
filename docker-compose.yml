# Ambiente LOCAL de desenvolvimento. Homologação e produção ficam em deploy/ (FND-10a).
name: bemaqui-empresas-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bemaqui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bemaqui_dev}
      POSTGRES_DB: catalog
    ports:
      - "127.0.0.1:5432:5432" # só na máquina local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bemaqui} -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Antivírus dos anexos (FND-07c). Na primeira subida, carregar as assinaturas leva de 1 a 2 minutos.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310" # só na máquina local
    volumes:
      - clamdb:/var/lib/clamav

  # SMTP de desenvolvimento (FND-08): veja os e-mails enviados em http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  clamdb:

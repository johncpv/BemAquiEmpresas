# Ambiente LOCAL de desenvolvimento. Produção/homologação: deploy/ (FND-10a).
name: bemaqui-empresas-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bemaqui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bemaqui_dev}
      POSTGRES_DB: catalog
    ports:
      - "127.0.0.1:5432:5432" # só na máquina local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bemaqui} -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
